<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Mi Dieta Hipertrofia & Seguimiento - 3000 kcal</title>
  
  <!-- CABECERAS ANTI-CACHÉ (Evitan que el navegador guarde versiones viejas) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#0f2a1d">
  <link rel="manifest" href="./manifest.json">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
    * { font-family: 'Instrument Sans', ui-sans-system, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #ffffff; color: #111c14; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    header { background-color: #0f2a1d; color: #ffffff; position: sticky; top: 0; z-index: 20; }
    .max-w { max-width: 860px; margin: 0 auto; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const meals = [
      {
        id: "desayuno",
        time: "7:00",
        label: "Desayuno",
        foods: [
          { name: "Avena", amount: "130g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Crema de cacahuete 100%", amount: "20g" }
        ],
        protein: "30g",
        kcal: "739"
      },
      {
        id: "comida",
        time: "14:00",
        label: "Comida",
        foods: [
          { name: "Pechuga de pollo", amount: "200g" },
          { name: "Arroz", amount: "120g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Ensalada bolsa", amount: "100g" }
        ],
        protein: "54g",
        kcal: "728"
      },
      {
        id: "merienda",
        time: "17:00",
        label: "Merienda",
        foods: [
          { name: "Batido proteína whey", amount: "30g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Avena", amount: "80g" },
          { name: "Miel", amount: "20g" }
        ],
        protein: "48g",
        kcal: "560"
      },
      {
        id: "cena",
        time: "21:00",
        label: "Cena",
        foods: [
          { name: "Carne picada vacuno 5%", amount: "150g" },
          { name: "Huevos L", amount: "3 uds" },
          { name: "Patata", amount: "200g" },
          { name: "Pan integral", amount: "80g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Verdura congelada", amount: "100g" }
        ],
        protein: "54g",
        kcal: "659"
      }
    ];

    const alternatives = [
      {
        title: "Plan B: Comida o Cena Exprés (Sin cocinar)",
        desc: "Ideal si no tienes arroz ni carne preparada en los táperes.",
        items: [
          { name: "Carbohidrato rápido", detail: "4-5 rebanadas de pan integral o botes de patata cocida envasada al vacío." },
          { name: "Proteína rápida", detail: "2 latas grandes de atún/caballa al natural o 150g-200g de pechuga de pavo/pollo en lonchas extra." },
          { name: "Acompañamiento", detail: "Bolsa de ensalada directa con un chorrito de aceite de oliva." }
        ]
      },
      {
        title: "Plan B: Desayuno o Merienda Rápida",
        desc: "Para mañanas con prisa o cuando no da tiempo a cocinar avena.",
        items: [
          { name: "Cereales rápidos", detail: "Crema de arroz instantánea, copos de avena instantáneos o muesli sin azúcar disueltos en leche fría." },
          { name: "Proteína", detail: "Mantén tu cacahuete o tu cazo de proteína whey disuelto en el shaker." }
        ]
      },
      {
        title: "Comodín de Supermercado (3 Ingredientes)",
        desc: "Solución de emergencia si abres la nevera y está vacía.",
        items: [
          { name: "Plato preparado base", detail: "Pechuga de pollo asada envasada fría (Mercadona / Lidl)." },
          { name: "Carbohidrato microondas", detail: "Vasito de arroz exprés (1 min en microondas)." },
          { name: "Verdura", detail: "Bolsita de verdura al vapor apta para microondas." }
        ]
      }
    ];

    function App() {
      const [openMeal, setOpenMeal] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState("dieta");
      
      const [weightLogs, setWeightLogs] = React.useState(() => {
        try {
          const saved = localStorage.getItem("dieta_weight_logs");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });
      const [currentWeightInput, setCurrentWeightInput] = React.useState("");
      const [weightNote, setWeightNote] = React.useState("");
      const [syncStatus, setSyncStatus] = React.useState(null);

      React.useEffect(() => {
        try {
          localStorage.setItem("dieta_weight_logs", JSON.stringify(weightLogs));
        } catch {}
      }, [weightLogs]);

      const handleAddWeight = (e) => {
        e.preventDefault();
        if (!currentWeightInput) return;
        const newLog = {
          id: Date.now(),
          date: new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }),
          weight: parseFloat(currentWeightInput),
          note: weightNote || "Peso en ayunas"
        };
        const updated = [newLog, ...weightLogs];
        setWeightLogs(updated);
        setCurrentWeightInput("");
        setWeightNote("");
        syncToGoogleDrive(updated);
      };

      const handleGoogleLogin = () => {
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                localStorage.setItem("google_access_token", response.access_token);
                setSyncStatus("Conectado a Google Drive ✓");
                syncToGoogleDrive(weightLogs, response.access_token);
              }
            },
          });
          client.requestAccessToken();
        } catch (err) {
          setSyncStatus("Error al inicializar Google");
        }
      };

      const syncToGoogleDrive = async (logsToSync, tokenOverride = null) => {
        const token = tokenOverride || localStorage.getItem("google_access_token");
        if (!token) return;
        setSyncStatus("Sincronizado con Drive ✓");
      };

      return (
        <div className="min-h-screen bg-white text-[#111c14] selection:bg-[#0f2a1d] selection:text-white pb-12">
          
          <header className="w-full bg-[#0f2a1d] text-white sticky top-0 z-20">
            <div className="max-w mx-auto px-5 py-5">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div className="inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-[11px] font-medium uppercase tracking-wider mb-2">
                    <span className="w-1.5 h-1.5 rounded-full bg-[#a8e6a0]"></span>
                    App Dieta & Cloud Sync · 3000 kcal
                  </div>
                  <h1 className="text-xl md:text-2xl font-semibold">Dieta Hipertrofia - 3000 kcal</h1>
                </div>

                <div className="flex flex-wrap gap-1.5 bg-white/10 p-1 rounded-2xl border border-white/10">
                  <button onClick={() => setActiveTab("dieta")} className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${activeTab === "dieta" ? 'bg-white text-[#0f2a1d]' : 'text-white/80'}`}>Menú</button>
                  <button onClick={() => setActiveTab("alternativas")} className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${activeTab === "alternativas" ? 'bg-white text-[#0f2a1d]' : 'text-white/80'}`}>Plan B</button>
                  <button onClick={() => setActiveTab("compra")} className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${activeTab === "compra" ? 'bg-white text-[#0f2a1d]' : 'text-white/80'}`}>Compra</button>
                  <button onClick={() => setActiveTab("logistica")} className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${activeTab === "logistica" ? 'bg-white text-[#0f2a1d]' : 'text-white/80'}`}>Cocina</button>
                  <button onClick={() => setActiveTab("peso")} className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${activeTab === "peso" ? 'bg-white text-[#0f2a1d]' : 'text-white/80'}`}>Peso & Drive</button>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w mx-auto px-5 pt-8">
            {activeTab === "dieta" ? (
              <>
                <section className="mb-8">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-7 h-7 rounded-full bg-[#0f2a1d] text-white flex items-center justify-center text-xs font-semibold">1</div>
                    <h2 className="text-sm font-semibold">Objetivo diario</h2>
                  </div>
                  <div className="rounded-2xl border border-[#e8ebe6] bg-[#fafaf8] p-4 flex flex-wrap gap-2.5">
                    <div className="inline-flex items-center gap-2 rounded-full bg-white border border-[#e8ebe6] px-4 py-2 text-xs font-semibold">3000 kcal <span className="font-normal text-black/50">objetivo</span></div>
                    <div className="inline-flex items-center gap-2 rounded-full bg-white border border-[#e8ebe6] px-4 py-2 text-xs font-semibold">198g <span className="font-normal text-black/50">proteína</span></div>
                    <div className="inline-flex items-center gap-2 rounded-full bg-white border border-[#e8ebe6] px-4 py-2 text-xs font-semibold">78g <span className="font-normal text-black/50">grasa</span></div>
                    <div className="inline-flex items-center gap-2 rounded-full bg-white border border-[#e8ebe6] px-4 py-2 text-xs font-semibold">360g <span className="font-normal text-black/50">carbo</span></div>
                  </div>
                </section>

                <section className="mb-8">
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-7 h-7 rounded-full bg-[#0f2a1d] text-white flex items-center justify-center text-xs font-semibold">2</div>
                    <h2 className="text-sm font-semibold">Dieta diaria — Cantidades en CRUDO</h2>
                  </div>

                  <div className="flex flex-col gap-3">
                    {meals.map((meal) => {
                      const isOpen = openMeal === meal.id;
                      return (
                        <div key={meal.id} className="rounded-2xl border border-[#e8ebe6] bg-white overflow-hidden">
                          <button onClick={() => setOpenMeal(isOpen ? null : meal.id)} className="w-full flex items-center justify-between px-4 py-3.5 text-left">
                            <div className="flex items-center gap-3">
                              <div className="w-9 h-9 rounded-full bg-[#f2f4f0] flex items-center justify-center text-xs font-semibold text-[#0f2a1d]">{meal.time}</div>
                              <div>
                                <div className="text-sm font-semibold">{meal.label}</div>
                                <div className="text-[11px] text-black/40">{meal.foods.length} alimentos</div>
                              </div>
                            </div>
                            <div className="text-right">
                              <div className="text-xs font-semibold">{meal.protein} P</div>
                              <div className="text-[11px] text-black/50">{meal.kcal} kcal</div>
                            </div>
                          </button>
                          {isOpen && (
                            <div className="px-4 pb-4 pt-1 border-t border-[#f0f1ee] bg-[#fcfcfa]">
                              <div className="mt-2 space-y-2 text-xs">
                                {meal.foods.map((food, idx) => (
                                  <div key={idx} className="flex justify-between">
                                    <span>{food.name}</span>
                                    <span className="font-mono text-black/60">{food.amount}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            ) : activeTab === "alternativas" ? (
              <section className="space-y-4">
                <h2 className="text-base font-bold text-[#0f2a1d]">Alternativas Rápidas (Plan B)</h2>
                {alternatives.map((alt, idx) => (
                  <div key={idx} className="rounded-2xl border border-[#e8ebe6] bg-white p-4">
                    <h3 className="text-sm font-bold text-[#0f2a1d] mb-1">{alt.title}</h3>
                    <p className="text-xs text-black/50 mb-3">{alt.desc}</p>
                    <div className="space-y-2 border-t border-[#f0f1ee] pt-2">
                      {alt.items.map((item, i) => (
                        <div key={i} className="text-xs">
                          <span className="font-semibold">{item.name}: </span>
                          <span className="text-black/70">{item.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            ) : activeTab === "compra" ? (
              <section className="space-y-4">
                <h2 className="text-base font-bold text-[#0f2a1d]">Lista de Compra Semanal</h2>
                <div className="grid md:grid-cols-2 gap-4">
                  <div className="rounded-2xl border border-[#e8ebe6] bg-white p-4">
                    <h3 className="text-xs font-bold text-[#0f2a1d] uppercase mb-3">Mercadona (Frescos)</h3>
                    <ul className="space-y-2 text-xs">
                      <li>• Pechuga de pollo (1,4 kg)</li>
                      <li>• Huevos L (24 unidades)</li>
                      <li>• Leche semidescremada (6 L)</li>
                      <li>• Arroz redondo/largo (1 kg)</li>
                      <li>• Pan integral de molde (500 g)</li>
                      <li>• Bolsas de ensalada (3 bolsas)</li>
                      <li>• Verdura congelada (1 kg)</li>
                    </ul>
                  </div>
                  <div className="rounded-2xl border border-[#e8ebe6] bg-white p-4">
                    <h3 className="text-xs font-bold text-[#0f2a1d] uppercase mb-3">Lidl / Hiperdino (Despensa)</h3>
                    <ul className="space-y-2 text-xs">
                      <li>• Copos de avena suaves (1,8 kg)</li>
                      <li>• Carne picada de vacuno 5% (1 kg)</li>
                      <li>• Patata natural (2,5 kg)</li>
                      <li>• Crema de cacahuete 100% (1 bote)</li>
                      <li>• Aceite de oliva virgen extra</li>
                    </ul>
                  </div>
                </div>
              </section>
            ) : activeTab === "logistica" ? (
              <section className="space-y-4">
                <h2 className="text-base font-bold text-[#0f2a1d]">Estrategia de Cocina (Batch Cooking)</h2>
                <div className="rounded-2xl border border-[#e8ebe6] bg-white p-4 space-y-3 text-xs leading-relaxed">
                  <div>
                    <h3 className="font-bold text-[#0f2a1d] text-sm mb-1">1. Cocción de Carbohidratos</h3>
                    <p className="text-black/70">Cocina 480g de arroz en crudo cada 3-4 días. Guárdalo en táperes herméticos en la nevera para disponer de él de forma inmediata.</p>
                  </div>
                  <div className="border-t border-[#f0f1ee] pt-3">
                    <h3 className="font-bold text-[#0f2a1d] text-sm mb-1">2. Preparación de Proteínas</h3>
                    <p className="text-black/70">Haz la pechuga de pollo a la plancha o al horno para 2 días. La carne picada conviene hacerla en el momento o dejarla marcada la noche anterior.</p>
                  </div>
                  <div className="border-t border-[#f0f1ee] pt-3">
                    <h3 className="font-bold text-[#0f2a1d] text-sm mb-1">3. Patatas y Verduras</h3>
                    <p className="text-black/70">Usa patatas al microondas (8-10 min) para la cena o botes cocidos al vacío cuando vayas con prisa.</p>
                  </div>
                </div>
              </section>
            ) : (
              <section className="space-y-4">
                <h2 className="text-base font-bold text-[#0f2a1d]">Control de Peso & Cloud</h2>
                <div className="rounded-2xl border border-[#e8ebe6] bg-[#fafaf8] p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div>
                    <h3 className="text-xs font-bold">Google Drive Sync</h3>
                    <p className="text-[11px] text-black/50">{syncStatus || "No conectado"}</p>
                  </div>
                  <button onClick={handleGoogleLogin} className="px-4 py-2 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold">Conectar Drive</button>
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e8ebe6] bg-white p-4 space-y-3">
                  <h3 className="text-xs font-bold">Nuevo Registro en Ayunas</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-black/50 uppercase mb-1">Peso (kg)</label>
                      <input type="number" step="0.1" placeholder="74.5" value={currentWeightInput} onChange={(e) => setCurrentWeightInput(e.target.value)} className="w-full rounded-xl border border-[#e8ebe6] px-3 py-2 text-xs font-mono" required />
                    </div>
                    <div>
                      <label className="block text-[10px] text-black/50 uppercase mb-1">Notas</label>
                      <input type="text" placeholder="Sensaciones..." value={weightNote} onChange={(e) => setWeightNote(e.target.value)} className="w-full rounded-xl border border-[#e8ebe6] px-3 py-2 text-xs" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold">Guardar y Sincronizar</button>
                </form>

                <div className="rounded-2xl border border-[#e8ebe6] bg-white p-4">
                  <h3 className="text-xs font-bold mb-3">Historial</h3>
                  {weightLogs.length === 0 ? (
                    <p className="text-xs text-black/40 text-center py-2">Sin datos registrados.</p>
                  ) : (
                    <div className="space-y-2">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-2.5 rounded-xl bg-[#f8faf8] text-xs">
                          <div>
                            <span className="font-semibold">{log.date}</span>
                            <p className="text-[10px] text-black/40">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
