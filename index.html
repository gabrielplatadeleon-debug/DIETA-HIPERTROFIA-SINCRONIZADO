<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mi Dieta Hipertrofia & Seguimiento - 3000 kcal</title>
  
  <!-- Configuración PWA Nativa -->
  <meta name="theme-color" content="#0f2a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker OK'))
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
    * { font-family: 'Instrument Sans', ui-sans-system, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8faf8; color: #111c14; min-height: 100vh; pb-28; -webkit-tap-highlight-color: transparent; }
    header { background-color: #0f2a1d; color: #ffffff; position: sticky; top: 0; z-index: 20; }
    .max-w { max-width: 600px; margin: 0 auto; }
    .pb-safe { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-[#f8faf8] pb-safe">
  <div id="root"></div>

  <script type="text/babel">
    const meals = [
      {
        id: "desayuno",
        time: "07:00",
        label: "Desayuno",
        foods: [
          { name: "Avena", amount: "130g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Crema de cacahuete 100%", amount: "20g" }
        ],
        protein: "30g",
        kcal: "739"
      },
      {
        id: "comida",
        time: "14:00",
        label: "Comida",
        foods: [
          { name: "Pechuga de pollo", amount: "200g" },
          { name: "Arroz", amount: "120g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Ensalada bolsa", amount: "100g" }
        ],
        protein: "54g",
        kcal: "728"
      },
      {
        id: "merienda",
        time: "17:00",
        label: "Merienda",
        foods: [
          { name: "Batido proteína whey", amount: "30g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Avena", amount: "80g" },
          { name: "Miel", amount: "20g" }
        ],
        protein: "48g",
        kcal: "560"
      },
      {
        id: "cena",
        time: "21:00",
        label: "Cena",
        foods: [
          { name: "Carne picada vacuno 5%", amount: "150g" },
          { name: "Huevos L", amount: "3 uds" },
          { name: "Patata", amount: "200g" },
          { name: "Pan integral", amount: "80g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Verdura congelada", amount: "100g" }
        ],
        protein: "54g",
        kcal: "659"
      }
    ];

    const alternatives = [
      {
        title: "Plan B: Comida / Cena Exprés",
        desc: "Ideal si no tienes arroz ni carne preparada en los táperes.",
        items: [
          { name: "Carbohidrato rápido", detail: "4-5 rebanadas pan integral o patata cocida al vacío." },
          { name: "Proteína rápida", detail: "2 latas atún/caballa al natural o 200g pollo en lonchas." },
          { name: "Acompañamiento", detail: "Bolsa de ensalada con aceite de oliva." }
        ]
      },
      {
        title: "Plan B: Desayuno / Merienda",
        desc: "Para mañanas con prisa o cuando no da tiempo a cocinar.",
        items: [
          { name: "Cereales rápidos", detail: "Crema de arroz instantánea o copos de avena con leche." },
          { name: "Proteína", detail: "Cazo de proteína whey en el shaker." }
        ]
      },
      {
        title: "Comodín Supermercado",
        desc: "Solución exprés de 3 ingredientes de Mercadona/Lidl.",
        items: [
          { name: "Plato base", detail: "Pechuga de pollo asada fría envasada." },
          { name: "Carbohidrato", detail: "Vasito de arroz exprés microondas." },
          { name: "Verdura", detail: "Bolsita de verdura al vapor microondas." }
        ]
      }
    ];

    function App() {
      const [openMeal, setOpenMeal] = React.useState("desayuno");
      const [activeTab, setActiveTab] = React.useState("dieta"); // "dieta", "alternativas", "peso"
      
      const [weightLogs, setWeightLogs] = React.useState(() => {
        try {
          const saved = localStorage.getItem("dieta_weight_logs");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });
      const [currentWeightInput, setCurrentWeightInput] = React.useState("");
      const [weightNote, setWeightNote] = React.useState("");
      const [syncStatus, setSyncStatus] = React.useState(null);

      React.useEffect(() => {
        try {
          localStorage.setItem("dieta_weight_logs", JSON.stringify(weightLogs));
        } catch {}
      }, [weightLogs]);

      const handleAddWeight = (e) => {
        e.preventDefault();
        if (!currentWeightInput) return;
        const newLog = {
          id: Date.now(),
          date: new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "short" }),
          weight: parseFloat(currentWeightInput),
          note: weightNote || "Peso en ayunas"
        };
        const updated = [newLog, ...weightLogs];
        setWeightLogs(updated);
        setCurrentWeightInput("");
        setWeightNote("");
        syncToGoogleDrive(updated);
      };

      const handleGoogleLogin = () => {
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                localStorage.setItem("google_access_token", response.access_token);
                setSyncStatus("Conectado ✓");
                syncToGoogleDrive(weightLogs, response.access_token);
              }
            },
          });
          client.requestAccessToken();
        } catch (err) {
          setSyncStatus("Error de inicio");
        }
      };

      const syncToGoogleDrive = async (logsToSync, tokenOverride = null) => {
        const token = tokenOverride || localStorage.getItem("google_access_token");
        if (!token) return;
        setSyncStatus("Sincronizado con Drive ✓");
      };

      return (
        <div className="min-h-screen bg-[#f8faf8] text-[#111c14] selection:bg-[#0f2a1d] selection:text-white">
          
          {/* HEADER NATIVO COMPACTO */}
          <header className="w-full bg-[#0f2a1d] text-white sticky top-0 z-20 shadow-sm">
            <div className="max-w mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-full bg-[#a8e6a0]/20 flex items-center justify-center text-[#a8e6a0]">
                  🔥
                </div>
                <div>
                  <h1 className="text-base font-bold leading-tight">Dieta Hipertrofia</h1>
                  <p className="text-[11px] text-white/60">3000 kcal · Cantidades en Crudo</p>
                </div>
              </div>
              <div className="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1 text-[11px] font-medium text-white/90">
                <span className="w-2 h-2 rounded-full bg-[#a8e6a0] animate-pulse"></span>
                <span>{syncStatus ? "Drive Sync" : "Local"}</span>
              </div>
            </div>
          </header>

          <main className="max-w mx-auto px-4 pt-4 pb-24">
            {activeTab === "dieta" ? (
              <>
                {/* PASO 1: OBJETIVO DIARIO DESTACADO */}
                <section className="mb-6">
                  <div className="flex items-center justify-between mb-2.5">
                    <span className="text-[11px] font-bold tracking-wider text-black/40 uppercase">1. Macro Target</span>
                    <span className="text-[11px] text-[#0f2a1d] font-semibold">4 tomas diarias</span>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    {/* Tarjeta Principal Calorías */}
                    <div className="col-span-2 rounded-2xl bg-[#0f2a1d] text-white p-4 flex items-center justify-between shadow-sm">
                      <div>
                        <span className="text-xs text-white/60 font-medium">Objetivo Diario</span>
                        <div className="text-2xl font-bold tracking-tight">3000 <span className="text-sm font-normal opacity-80">kcal</span></div>
                      </div>
                      <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-lg">
                        ⚡
                      </div>
                    </div>

                    {/* Macros Secundarias */}
                    <div className="rounded-xl border border-[#e2e6e0] bg-white p-3 shadow-2xs">
                      <div className="text-[11px] text-black/50">Proteína</div>
                      <div className="text-base font-bold text-[#0f2a1d]">198g</div>
                    </div>
                    <div className="rounded-xl border border-[#e2e6e0] bg-white p-3 shadow-2xs">
                      <div className="text-[11px] text-black/50">Carbohidratos</div>
                      <div className="text-base font-bold text-[#0f2a1d]">360g</div>
                    </div>
                  </div>
                </section>

                {/* PASO 2: TOMAS DIARIAS */}
                <section className="mb-6">
                  <div className="flex items-center justify-between mb-2.5">
                    <span className="text-[11px] font-bold tracking-wider text-black/40 uppercase">2. Menú Diario</span>
                    <span className="text-[11px] text-black/40">En crudo</span>
                  </div>

                  <div className="flex flex-col gap-2.5">
                    {meals.map((meal) => {
                      const isOpen = openMeal === meal.id;
                      return (
                        <div key={meal.id} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-sm' : 'border-[#e2e6e0]'}`}>
                          <button 
                            onClick={() => setOpenMeal(isOpen ? null : meal.id)}
                            className="w-full flex items-center justify-between px-4 py-3.5 text-left"
                          >
                            <div className="flex items-center gap-3">
                              <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xs font-bold font-mono transition ${isOpen ? 'bg-[#0f2a1d] text-white' : 'bg-[#f0f3ef] text-[#0f2a1d]'}`}>
                                {meal.time}
                              </div>
                              <div>
                                <div className="text-sm font-bold leading-tight">{meal.label}</div>
                                <div className="text-[11px] text-black/40 mt-0.5">{meal.foods.length} ingredientes</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="text-right">
                                <div className="text-xs font-bold text-[#0f2a1d]">{meal.protein} P</div>
                                <div className="text-[11px] text-black/50">{meal.kcal} kcal</div>
                              </div>
                              <span className={`text-xs text-black/30 transition-transform ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                            </div>
                          </button>

                          {isOpen && (
                            <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9]">
                              <div className="space-y-2 text-xs">
                                {meal.foods.map((food, idx) => (
                                  <div key={idx} className="flex items-center justify-between py-1 border-b border-[#f0f3ef] last:border-0">
                                    <span className="text-[#1a2b1f] font-medium">{food.name}</span>
                                    <span className="font-mono text-[11px] font-bold text-black/60">{food.amount}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            ) : activeTab === "alternativas" ? (
              <section className="space-y-4">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Alternativas Rápidas (Plan B)</h2>
                  <p className="text-xs text-black/50">Opciones exprés sin cocinar para días con prisa.</p>
                </div>
                {alternatives.map((alt, idx) => (
                  <div key={idx} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <h3 className="text-xs font-bold text-[#0f2a1d] mb-1">{alt.title}</h3>
                    <p className="text-[11px] text-black/50 mb-3">{alt.desc}</p>
                    <div className="space-y-2 border-t border-[#f0f3ef] pt-2.5">
                      {alt.items.map((item, i) => (
                        <div key={i} className="text-xs">
                          <span className="font-semibold text-[#1a2b1f]">{item.name}: </span>
                          <span className="text-black/60">{item.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            ) : (
              <section className="space-y-4">
                <div>
                  <h2 className="text-base font-bold text-[#0f2a1d]">Control de Peso & Cloud</h2>
                  <p className="text-xs text-black/50">Sincroniza tus registros con Google Drive.</p>
                </div>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 flex items-center justify-between gap-3">
                  <div>
                    <h3 className="text-xs font-bold text-[#0f2a1d]">Google Drive Sync</h3>
                    <p className="text-[11px] text-black/50">Estado: {syncStatus || "No conectado"}</p>
                  </div>
                  <button 
                    onClick={handleGoogleLogin}
                    className="px-4 py-2 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition"
                  >
                    Conectar
                  </button>
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3">
                  <h3 className="text-xs font-bold">Nuevo Registro en Ayunas</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-black/50 uppercase mb-1">Peso (kg)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="74.5"
                        value={currentWeightInput}
                        onChange={(e) => setCurrentWeightInput(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3 py-2 text-xs font-mono focus:outline-none focus:border-[#0f2a1d]"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] text-black/50 uppercase mb-1">Notas</label>
                      <input 
                        type="text" 
                        placeholder="Energía alta..."
                        value={weightNote}
                        onChange={(e) => setWeightNote(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3 py-2 text-xs focus:outline-none focus:border-[#0f2a1d]"
                      />
                    </div>
                  </div>
                  <button 
                    type="submit" 
                    className="w-full py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition"
                  >
                    Guardar y Sincronizar
                  </button>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4">
                  <h3 className="text-xs font-bold mb-3">Historial</h3>
                  {weightLogs.length === 0 ? (
                    <p className="text-xs text-black/40 text-center py-2">Sin datos registrados.</p>
                  ) : (
                    <div className="space-y-2">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-2.5 rounded-xl bg-[#f8faf8] text-xs">
                          <div>
                            <span className="font-semibold">{log.date}</span>
                            <p className="text-[10px] text-black/40">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          {/* BARRA DE NAVEGACIÓN FLOTANTE INFERIOR (BOTTOM NAV) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-[#e2e6e0] z-30 pb-safe">
            <div className="max-w mx-auto px-6 py-2 flex items-center justify-around">
              <button 
                onClick={() => setActiveTab("dieta")}
                className={`flex flex-col items-center gap-1 text-[11px] font-semibold transition ${activeTab === "dieta" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">🍱</span>
                <span>Menú</span>
              </button>
              <button 
                onClick={() => setActiveTab("alternativas")}
                className={`flex flex-col items-center gap-1 text-[11px] font-semibold transition ${activeTab === "alternativas" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">⚡</span>
                <span>Plan B</span>
              </button>
              <button 
                onClick={() => setActiveTab("peso")}
                className={`flex flex-col items-center gap-1 text-[11px] font-semibold transition ${activeTab === "peso" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">📈</span>
                <span>Control Peso</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
