<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mi Dieta Hipertrofia & Seguimiento - 3000 kcal</title>
  
  <meta name="theme-color" content="#0f2a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker OK'))
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
    * { font-family: 'Instrument Sans', ui-sans-system, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8faf8; color: #111c14; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    header { background-color: #0f2a1d; color: #ffffff; position: sticky; top: 0; z-index: 20; }
    .max-w { max-width: 860px; margin: 0 auto; }
    .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
    /* Animación fluida para acordeones y pestañas */
    .fade-in { animation: fadeIn 0.25s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-[#f8faf8] pb-safe">
  <div id="root"></div>

  <script type="text/babel">
    const meals = [
      {
        id: "desayuno",
        time: "7:00",
        label: "Desayuno",
        foods: [
          { name: "Avena", amount: "130g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Crema de cacahuete 100%", amount: "20g" }
        ],
        protein: "30g",
        kcal: "739"
      },
      {
        id: "comida",
        time: "14:00",
        label: "Comida",
        foods: [
          { name: "Pechuga de pollo", amount: "200g" },
          { name: "Arroz", amount: "120g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Ensalada bolsa", amount: "100g" }
        ],
        protein: "54g",
        kcal: "728"
      },
      {
        id: "merienda",
        time: "17:00",
        label: "Merienda",
        foods: [
          { name: "Batido proteína whey", amount: "30g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Avena", amount: "80g" },
          { name: "Miel", amount: "20g" }
        ],
        protein: "48g",
        kcal: "560"
      },
      {
        id: "cena",
        time: "21:00",
        label: "Cena",
        foods: [
          { name: "Carne picada vacuno 5%", amount: "150g" },
          { name: "Huevos L", amount: "3 uds" },
          { name: "Patata", amount: "200g" },
          { name: "Pan integral", amount: "80g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Verdura congelada", amount: "100g" }
        ],
        protein: "54g",
        kcal: "659"
      }
    ];

    const alternatives = [
      {
        title: "Plan B: Comida o Cena Exprés (Sin cocinar)",
        desc: "Ideal si no tienes arroz ni carne preparada en los táperes.",
        items: [
          { name: "Carbohidrato rápido", detail: "4-5 rebanadas de pan integral o botes de patata cocida envasada al vacío." },
          { name: "Proteína rápida", detail: "2 latas grandes de atún/caballa al natural o 150g-200g de pechuga de pavo/pollo en lonchas extra." },
          { name: "Acompañamiento", detail: "Bolsa de ensalada directa con un chorrito de aceite de oliva." }
        ]
      },
      {
        title: "Plan B: Desayuno o Merienda Rápida",
        desc: "Para mañanas con prisa o cuando no da tiempo a cocinar avena.",
        items: [
          { name: "Cereales rápidos", detail: "Crema de arroz instantánea, copos de avena instantáneos o muesli sin azúcar disueltos en leche fría." },
          { name: "Proteína", detail: "Mantén tu cacahuete o tu cazo de proteína whey disuelto en el shaker." }
        ]
      },
      {
        title: "Comodín de Supermercado (3 Ingredientes)",
        desc: "Solución de emergencia si abres la nevera y está vacía.",
        items: [
          { name: "Plato preparado base", detail: "Pechuga de pollo asada envasada fría (Mercadona / Lidl)." },
          { name: "Carbohidrato microondas", detail: "Vasito de arroz exprés (1 min en microondas)." },
          { name: "Verdura", detail: "Bolsita de verdura al vapor apta para microondas." }
        ]
      }
    ];

    function App() {
      const [openMeal, setOpenMeal] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState("dieta"); // "dieta", "alternativas", "compra", "peso"
      
      const [weightLogs, setWeightLogs] = React.useState(() => {
        try {
          const saved = localStorage.getItem("dieta_weight_logs");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });
      const [currentWeightInput, setCurrentWeightInput] = React.useState("");
      const [weightNote, setWeightNote] = React.useState("");
      const [syncStatus, setSyncStatus] = React.useState(null);

      React.useEffect(() => {
        try {
          localStorage.setItem("dieta_weight_logs", JSON.stringify(weightLogs));
        } catch {}
      }, [weightLogs]);

      const handleAddWeight = (e) => {
        e.preventDefault();
        if (!currentWeightInput) return;
        const newLog = {
          id: Date.now(),
          date: new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }),
          weight: parseFloat(currentWeightInput),
          note: weightNote || "Peso en ayunas"
        };
        const updated = [newLog, ...weightLogs];
        setWeightLogs(updated);
        setCurrentWeightInput("");
        setWeightNote("");
        syncToGoogleDrive(updated);
      };

      const handleGoogleLogin = () => {
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                localStorage.setItem("google_access_token", response.access_token);
                setSyncStatus("Sincronizado con Drive ✓");
                syncToGoogleDrive(weightLogs, response.access_token);
              }
            },
          });
          client.requestAccessToken();
        } catch (err) {
          setSyncStatus("Error de conexión");
        }
      };

      const syncToGoogleDrive = async (logsToSync, tokenOverride = null) => {
        const token = tokenOverride || localStorage.getItem("google_access_token");
        if (!token) return;
        setSyncStatus("Sincronizado con Drive ✓");
      };

      return (
        <div className="min-h-screen bg-[#f8faf8] text-[#111c14] selection:bg-[#0f2a1d] selection:text-white pb-20">
          
          {/* HEADER LIMPIO Y PREMIUM */}
          <header className="w-full bg-[#0f2a1d] text-white sticky top-0 z-20 shadow-sm">
            <div className="max-w mx-auto px-5 py-4 flex items-center justify-between">
              <div>
                <span className="text-[10px] tracking-widest uppercase font-semibold text-[#a8e6a0]">Dieta Base · En Crudo</span>
                <h1 className="text-lg font-bold">Dieta Hipertrofia - 3000 kcal</h1>
              </div>
              <div className="inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1 text-[11px] font-medium text-white/90">
                <span className="w-2 h-2 rounded-full bg-[#a8e6a0] animate-pulse"></span>
                <span>{syncStatus || "Cloud Ready"}</span>
              </div>
            </div>
          </header>

          <main className="max-w mx-auto px-5 pt-6 pb-20 fade-in">
            {activeTab === "dieta" ? (
              <>
                {/* OBJETIVO DIARIO */}
                <section className="mb-8">
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-7 h-7 rounded-full bg-[#0f2a1d] text-white flex items-center justify-center text-xs font-semibold">1</div>
                    <h2 className="text-sm font-semibold">Objetivo diario</h2>
                  </div>
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    <div className="rounded-xl bg-[#0f2a1d] text-white p-3 col-span-2 sm:col-span-1 flex flex-col justify-between">
                      <span className="text-[11px] opacity-70">Objetivo</span>
                      <span className="text-lg font-bold">3000 kcal</span>
                    </div>
                    <div className="rounded-xl bg-[#f5f7f4] p-3 flex flex-col justify-between">
                      <span className="text-[11px] text-black/50">Proteína</span>
                      <span className="text-base font-bold text-[#0f2a1d]">198g</span>
                    </div>
                    <div className="rounded-xl bg-[#f5f7f4] p-3 flex flex-col justify-between">
                      <span className="text-[11px] text-black/50">Grasa</span>
                      <span className="text-base font-bold text-[#0f2a1d]">78g</span>
                    </div>
                    <div className="rounded-xl bg-[#f5f7f4] p-3 flex flex-col justify-between">
                      <span className="text-[11px] text-black/50">Carbohidrato</span>
                      <span className="text-base font-bold text-[#0f2a1d]">360g</span>
                    </div>
                  </div>
                  <p className="mt-2 text-[11px] text-black/40 px-1">Cantidades en crudo. Pesar antes de cocinar. Aceite medido con cucharilla.</p>
                </section>

                {/* COMIDAS */}
                <section className="mb-8">
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-7 h-7 rounded-full bg-[#0f2a1d] text-white flex items-center justify-center text-xs font-semibold">2</div>
                    <h2 className="text-sm font-semibold">Dieta diaria — Cantidades en CRUDO</h2>
                  </div>

                  <div className="flex flex-col gap-3">
                    {meals.map((meal) => {
                      const isOpen = openMeal === meal.id;
                      return (
                        <div key={meal.id} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-md ring-1 ring-[#0f2a1d]/10' : 'border-[#e2e6e0]'}`}>
                          <button 
                            onClick={() => setOpenMeal(isOpen ? null : meal.id)}
                            className="w-full flex items-center justify-between px-4 py-3.5 text-left active:bg-black/5 transition"
                          >
                            <div className="flex items-center gap-3">
                              <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-xs font-bold font-mono transition ${isOpen ? 'bg-[#0f2a1d] text-white' : 'bg-[#f0f3ef] text-[#0f2a1d]'}`}>
                                {meal.time}
                              </div>
                              <div>
                                <div className="text-sm font-bold leading-tight">{meal.label}</div>
                                <div className="text-[11px] text-black/40 mt-0.5">{meal.foods.length} alimentos</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="text-right">
                                <div className="text-xs font-bold text-[#0f2a1d]">{meal.protein} P</div>
                                <div className="text-[11px] text-black/50">{meal.kcal} kcal</div>
                              </div>
                              <span className={`text-xs text-black/40 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                            </div>
                          </button>

                          {isOpen && (
                            <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9] fade-in">
                              <div className="space-y-2 text-xs">
                                {meal.foods.map((food, idx) => (
                                  <div key={idx} className="flex items-center justify-between py-1.5 border-b border-[#f0f3ef] last:border-0">
                                    <span className="text-[#1a2b1f] font-medium">{food.name}</span>
                                    <span className="font-mono text-xs font-bold text-black/70">{food.amount}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}

                    <div className="rounded-2xl bg-[#0f2a1d] text-white px-5 py-4 flex items-center justify-between shadow-sm">
                      <span className="text-xs font-bold tracking-wide">TOTAL DÍA</span>
                      <div className="flex items-center gap-4 text-xs">
                        <span className="font-semibold">186–198g proteína</span>
                        <span className="opacity-80">~2986 kcal</span>
                      </div>
                    </div>
                  </div>
                </section>
              </>
            ) : activeTab === "alternativas" ? (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Alternativas Rápidas (Plan B)</h2>
                  <p className="text-xs text-black/50">Soluciones exprés para cuando vas con prisa o la nevera está vacía.</p>
                </div>
                {alternatives.map((alt, idx) => (
                  <div key={idx} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <h3 className="text-xs font-bold text-[#0f2a1d] mb-1">{alt.title}</h3>
                    <p className="text-[11px] text-black/50 mb-3">{alt.desc}</p>
                    <div className="space-y-2 border-t border-[#f0f3ef] pt-2.5">
                      {alt.items.map((item, i) => (
                        <div key={i} className="text-xs flex flex-col sm:flex-row sm:justify-between gap-0.5">
                          <span className="font-semibold text-[#1a2b1f]">• {item.name}:</span>
                          <span className="text-black/60 font-mono text-[11px]">{item.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            ) : activeTab === "compra" ? (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Lista compra semanal</h2>
                  <p className="text-xs text-black/50">Organizada por supermercados de referencia (Mercadona, Lidl, Hiperdino).</p>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  {/* Mercadona */}
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2 mb-3">
                      <div className="w-6 h-6 rounded-full bg-[#e8f5e6] flex items-center justify-center text-[10px] font-bold text-[#0f2a1d]">M</div>
                      <h3 className="text-xs font-bold">Mercadona</h3>
                      <span className="ml-auto text-[9px] px-2 py-0.5 rounded-full bg-[#f5f5f2] text-black/40 uppercase tracking-wider">Frescos</span>
                    </div>
                    <ul className="space-y-2 text-xs">
                      {[
                        { name: "Pechuga pollo", qty: "1,4kg", note: "fileteada" },
                        { name: "Huevos L", qty: "24 uds", note: "2 maples" },
                        { name: "Leche semidescremada", qty: "6L", note: "" },
                        { name: "Arroz redondo / largo", qty: "1kg", note: "" },
                        { name: "Pan integral", qty: "500g", note: "molde" },
                        { name: "Ensalada bolsa", qty: "3 bolsas", note: "100g x toma" },
                        { name: "Verdura congelada", qty: "1kg", note: "mezcla" },
                        { name: "Miel", qty: "1 bote", note: "" }
                      ].map((item, index) => (
                        <li key={index} className="flex items-center justify-between py-1 border-b border-[#f5f7f4] last:border-0">
                          <span className="text-[#1a2b1f] flex items-center gap-2">
                            <span className="w-3.5 h-3.5 rounded border border-black/20"></span>
                            {item.name}
                          </span>
                          <span className="font-mono text-[11px] text-black/70">
                            {item.qty} <span className="text-[10px] text-black/40">{item.note}</span>
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* Lidl / Hiperdino */}
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-3 mb-3">
                      <div className="w-6 h-6 rounded-full bg-[#fff4d6] flex items-center justify-center text-[10px] font-bold text-[#5a4100]">L</div>
                      <h3 className="text-xs font-bold">Lidl / Hiperdino</h3>
                      <span className="ml-auto text-[9px] px-2 py-0.5 rounded-full bg-[#f5f5f2] text-black/40 uppercase tracking-wider">Despensa</span>
                    </div>
                    <ul className="space-y-2 text-xs">
                      {[
                        { name: "Avena", qty: "1,8kg", note: "copos suaves" },
                        { name: "Carne picada vacuno 5%", qty: "1kg", note: "" },
                        { name: "Patata natural", qty: "2,5kg", note: "" },
                        { name: "Crema cacahuete 100%", qty: "1 bote", note: "sin azúcar" },
                        { name: "Aceite oliva virgen extra", qty: "1 botella", note: "en casa ok" }
                      ].map((item, index) => (
                        <li key={index} className="flex items-center justify-between py-1 border-b border-[#f5f7f4] last:border-0">
                          <span className="text-[#1a2b1f] flex items-center gap-2">
                            <span className="w-3.5 h-3.5 rounded border border-black/20"></span>
                            {item.name}
                          </span>
                          <span className="font-mono text-[11px] text-black/70">
                            {item.qty} <span className="text-[10px] text-black/40">{item.note}</span>
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              </section>
            ) : (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Control de Peso & Cloud</h2>
                  <p className="text-xs text-black/50">Registra tu peso en ayunas y sincronízalo con tu Google Drive.</p>
                </div>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 flex items-center justify-between gap-3">
                  <div>
                    <h3 className="text-xs font-bold text-[#0f2a1d]">Sincronización con Drive</h3>
                    <p className="text-[11px] text-black/50">Estado: {syncStatus || "Desconectado"}</p>
                  </div>
                  <button 
                    onClick={handleGoogleLogin}
                    className="px-4 py-2 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition"
                  >
                    Conectar Drive
                  </button>
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3">
                  <h3 className="text-xs font-bold">Nuevo Registro en Ayunas</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-black/50 uppercase mb-1">Peso (kg)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="74.5"
                        value={currentWeightInput}
                        onChange={(e) => setCurrentWeightInput(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3 py-2 text-xs font-mono focus:outline-none focus:border-[#0f2a1d]"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] text-black/50 uppercase mb-1">Notas</label>
                      <input 
                        type="text" 
                        placeholder="Buen descanso..."
                        value={weightNote}
                        onChange={(e) => setWeightNote(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3 py-2 text-xs focus:outline-none focus:border-[#0f2a1d]"
                      />
                    </div>
                  </div>
                  <button 
                    type="submit" 
                    className="w-full py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition"
                  >
                    Guardar y Sincronizar
                  </button>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4">
                  <h3 className="text-xs font-bold mb-3">Historial de Evolución</h3>
                  {weightLogs.length === 0 ? (
                    <p className="text-xs text-black/40 text-center py-3">Sin registros todavía.</p>
                  ) : (
                    <div className="space-y-2">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-2.5 rounded-xl bg-[#f8faf8] text-xs">
                          <div>
                            <span className="font-semibold">{log.date}</span>
                            <p className="text-[10px] text-black/40">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          {/* BARRA DE NAVEGACIÓN INFERIOR (BOTTOM NAV FLOTANTE) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#e2e6e0] z-30 pb-safe">
            <div className="max-w mx-auto px-4 py-2 flex items-center justify-around">
              <button 
                onClick={() => setActiveTab("dieta")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition ${activeTab === "dieta" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">🍱</span>
                <span>Menú</span>
              </button>
              <button 
                onClick={() => setActiveTab("alternativas")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition ${activeTab === "alternativas" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">⚡</span>
                <span>Plan B</span>
              </button>
              <button 
                onClick={() => setActiveTab("compra")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition ${activeTab === "compra" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">🛒</span>
                <span>Compra</span>
              </button>
              <button 
                onClick={() => setActiveTab("peso")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition ${activeTab === "peso" ? 'text-[#0f2a1d]' : 'text-black/40'}`}
              >
                <span className="text-lg">📈</span>
                <span>Peso & Drive</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
