    /* ==========================================
       CAPA 2: SERVICIOS GOOGLE DRIVE API
       ========================================== */
    const DriveService = {
      initAuth(onSuccess) {
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                localStorage.setItem("google_access_token", response.access_token);
                onSuccess(response.access_token);
              }
            },
          });
          client.requestAccessToken();
        } catch (err) {}
      },
      async getOrCreateFolder(token) {
        try {
          const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='Mi_Dieta_PWA' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
          const res = await fetch(searchUrl, { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          if (data.files && data.files.length > 0) return data.files[0].id;

          const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name: "Mi_Dieta_PWA", mimeType: "application/vnd.google-apps.folder" })
          });
          const folderData = await createRes.json();
          return folderData.id;
        } catch (err) {
          return null;
        }
      },
      async syncCloudProfile(profileId, payload) {
        const token = localStorage.getItem("google_access_token");
        if (!token) return { success: false };
        try {
          const folderId = await this.getOrCreateFolder(token);
          const fileName = `perfil_${profileId}.json`;
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });

          const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and '${folderId}' in parents and trashed=false`;
          const searchRes = await fetch(searchUrl, { headers: { Authorization: `Bearer ${token}` } });
          const searchData = await searchRes.json();

          if (searchData.files && searchData.files.length > 0) {
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${searchData.files[0].id}?uploadType=media`, {
              method: "PATCH",
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              body: blob
            });
          } else {
            const metadata = { name: fileName, parents: [folderId], mimeType: "application/json" };
            const form = new FormData();
            form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
            form.append("file", blob);
            await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
              body: form
            });
          }
          return { success: true };
        } catch (err) {
          return { success: false };
        }
      }
    };

    /* ==========================================
       CAPA 3: GRÁFICA SVG NATIVA
       ========================================== */
    function WeightChart({ logs }) {
      if (!logs || logs.length < 2) {
        return <div className="p-4 text-center text-xs text-black/50 bg-[#f8faf8] rounded-xl border border-[#f0f3ef]">Registra al menos 2 pesajes.</div>;
      }
      const sortedLogs = [...logs].reverse();
      const weights = sortedLogs.map(l => l.weight);
      const minW = Math.min(...weights) - 0.5;
      const maxW = Math.max(...weights) + 0.5;
      const range = maxW - minW || 1;

      const height = 120;
      const width = 300;
      const padding = 20;

      const points = sortedLogs.map((log, i) => {
        const x = padding + (i / (sortedLogs.length - 1)) * (width - padding * 2);
        const y = height - padding - ((log.weight - minW) / range) * (height - padding * 2);
        return { x, y, weight: log.weight };
      });

      const pathD = points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, "");

      return (
        <div className="space-y-2">
          <div className="flex items-center justify-between text-xs font-semibold text-black/60">
            <span>Mín: {minW.toFixed(1)} kg</span>
            <span className="text-[#0f2a1d] font-bold">Evolución de Peso</span>
            <span>Máx: {maxW.toFixed(1)} kg</span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-32 overflow-visible">
            <path d={pathD} fill="none" stroke="#0f2a1d" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            {points.map((p, i) => (
              <g key={i}>
                <circle cx={p.x} cy={p.y} r="4" fill="#0f2a1d" />
                <text x={p.x} y={p.y - 8} textAnchor="middle" className="text-[9px] font-mono font-bold fill-[#0f2a1d]">{p.weight}</text>
              </g>
            ))}
          </svg>
        </div>
      );
    }

          customKcal: 3000,

        setActiveProfileId(newProf.id);
        setNewProfileName("");
      };

      const updateKcal = (delta) => {
        setProfiles(prev => prev.map(p => {
          if (p.id === activeProfileId) {
            const current = p.customKcal || 3000;
            return { ...p, customKcal: Math.max(1500, Math.min(5500, current + delta)) };
          }
          return p;
        }));
      };

      // Generador Dinámico de la Lista de Compra basado en la variante activa de cada comida
      const computedShoppingList = React.useMemo(() => {
        const mapMercadona = {};
        const mapDespensa = {};

        baseDiet.meals.forEach(meal => {
          const vIdx = activeVariants[meal.id] || 0;
          const selectedVariant = meal.variants[vIdx] || meal.variants[0];

          selectedVariant.foods.forEach(food => {
            const scaledAmount = food.unit === 'uds'
              ? Math.round(food.baseAmount * scaleFactor)
              : Math.round(food.baseAmount * scaleFactor * 7);

            const unitLabel = food.unit === 'uds' ? 'uds' : (food.unit === 'ml' ? 'ml' : 'g');
            const targetMap = food.category === 'mercadona' ? mapMercadona : mapDespensa;

            if (targetMap[food.name]) {
              targetMap[food.name].total += scaledAmount;
            } else {
              targetMap[food.name] = { total: scaledAmount, unit: unitLabel };
            }
          });
        });

        const formatList = (map, catName) => {
          return Object.keys(map).map((name, idx) => {
            const item = map[name];
            let displayQty = item.total;
            let displayUnit = item.unit;

            if (item.unit === 'g' && item.total >= 1000) {
              displayQty = (item.total / 1000).toFixed(1).replace('.0', '');
              displayUnit = 'kg';
            } else if (item.unit === 'ml' && item.total >= 1000) {
              displayQty = (item.total / 1000).toFixed(1).replace('.0', '');
              displayUnit = 'L';
            }

            return {
              id: `${catName}_${idx}_${name}`,
              name,
              qtyText: `${displayQty} ${displayUnit}`
            };
          });
        };

        return {
          mercadona: formatList(mapMercadona, 'm'),
          despensa: formatList(mapDespensa, 'd')
        };
      }, [baseDiet, activeVariants, scaleFactor]);

          weights: updated,
          checked: checkedItems
        });
        setSyncStatus(res.success ? "Cloud ✓" : "Local");
      };

                        <span className="text-base font-bold text-[#0f2a1d]">{currentProtein}g</span>
                      </div>
                      <div className="rounded-xl bg-[#f4f7f3] p-3 text-center border border-[#e2e6e0]">
                        <span className="block text-[11px] font-semibold text-black/50">Grasas</span>
                        <span className="text-base font-bold text-[#0f2a1d]">{currentFats}g</span>
                      </div>
                      <div className="rounded-xl bg-[#f4f7f3] p-3 text-center border border-[#e2e6e0]">
                        <span className="block text-[11px] font-semibold text-black/50">Carbos</span>
                        <span className="text-base font-bold text-[#0f2a1d]">{currentCarbs}g</span>
                      </div>
                    </div>
                  </div>
                </section>

                <section className="mb-5">
                  <div className="flex items-center justify-between mb-2.5">
                    <h2 className="text-xs font-bold tracking-wider text-black/50 uppercase">Menú Diario con Variantes</h2>
                    <span className="text-xs text-black/50">Elige la variante de plato</span>
                  </div>

                  <div className="flex flex-col gap-3">
                    {baseDiet.meals.map((meal) => {
                      const isOpen = openMeal === meal.id;
                      const currentVariantIndex = activeVariants[meal.id] || 0;
                      const selectedVariant = meal.variants[currentVariantIndex] || meal.variants[0];
                      const mealKcal = Math.round(meal.baseKcal * scaleFactor);
                      const mealProt = Math.round(meal.baseProtein * scaleFactor);

                      return (
                        <div key={meal.id} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-sm ring-1 ring-[#0f2a1d]/15' : 'border-[#e2e6e0]'}`}>
                          <button 
                            onClick={() => setOpenMeal(isOpen ? null : meal.id)}
                            className="w-full flex items-center justify-between px-4 py-4 text-left active:bg-black/5 transition"
                          >
                            <div className="flex items-center gap-3.5">
                              <div className={`w-11 h-11 rounded-xl flex items-center justify-center text-sm font-bold font-mono transition ${isOpen ? 'bg-[#0f2a1d] text-white' : 'bg-[#eef2ec] text-[#0f2a1d]'}`}>
                                {meal.time}
                              </div>
                              <div>
                                <div className="text-base font-bold leading-tight">{meal.label}: <span className="font-normal text-black/70 text-sm">{selectedVariant.title}</span></div>
                                <div className="text-xs text-black/50 mt-0.5">{selectedVariant.foods.length} ingredientes</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="text-right">
                                <div className="text-sm font-bold text-[#0f2a1d]">{mealProt}g P</div>
                                <div className="text-xs font-medium text-black/60">{mealKcal} kcal</div>
                              </div>
                              <span className={`text-xs text-black/40 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                            </div>
                          </button>

                          {isOpen && (
                            <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9] space-y-3.5 fade-in">
                              {/* SELECTOR DE VARIANTES */}
                              <div className="flex items-center justify-between bg-white p-2.5 rounded-xl border border-[#e2e6e0]">
                                <span className="text-xs font-bold text-black/60 uppercase">Variante de Plato:</span>
                                <div className="flex gap-1.5">
                                  {meal.variants.map((v, vIdx) => (
                                    <button
                                      key={vIdx}
                                      onClick={() => setVariantForMeal(meal.id, vIdx)}
                                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${currentVariantIndex === vIdx ? 'bg-[#0f2a1d] text-white' : 'bg-[#f4f7f3] text-black/70 hover:bg-[#eef2ec]'}`}
                                    >
                                      Opción {vIdx + 1}
                                    </button>
                                  ))}
                                </div>
                              </div>

                              <div className="space-y-2 text-sm">
                                {selectedVariant.foods.map((food, idx) => {
                                  const scaledAmount = Math.round(food.baseAmount * scaleFactor);
                                  return (
                                    <div key={idx} className="flex items-center justify-between py-1.5 border-b border-[#f0f3ef] last:border-0">
                                      <span className="text-[#1a2b1f] font-semibold text-sm">{food.name}</span>
                                      <span className="font-mono text-sm font-bold bg-white px-2.5 py-1 rounded-md border border-[#e2e6e0] text-black/90">
                                        {scaledAmount}{food.unit}
                                      </span>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            )}

            {activeTab === "alternativas" && (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Plan B Exprés</h2>
                  <p className="text-sm text-black/70">Soluciones rápidas sin cocinar.</p>
                </div>
                {ALTERNATIVES_DATA.map((alt, idx) => (
                  <div key={idx} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs space-y-3">
                    <h3 className="text-base font-bold text-[#0f2a1d]">{alt.title}</h3>
                    <p className="text-sm text-black/70 leading-relaxed">{alt.desc}</p>
                    <div className="space-y-2.5 border-t border-[#f0f3ef] pt-3 mt-2">
                      {alt.items.map((item, i) => (
                        <div key={i} className="text-sm leading-relaxed">
                          <span className="font-bold text-[#1a2b1f]">• {item.name}: </span>
                          <span className="text-black/85">{item.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            )}

            {activeTab === "compra" && (
              <section className="space-y-4 fade-in">
                <div className="flex items-center justify-between mb-1">
                  <div>
                    <h2 className="text-xl font-bold text-[#0f2a1d]">Lista de Compra Automática</h2>
                    <p className="text-sm text-black/70">Actualizada según las variantes seleccionadas.</p>
                  </div>
                  <button onClick={resetShoppingList} className="text-xs font-semibold text-[#0f2a1d] underline bg-[#eef2ec] px-3.5 py-2 rounded-xl">
                    Desmarcar todo
                  </button>
                </div>

                <div className="space-y-4">
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#e8f5e6] flex items-center justify-center text-xs font-bold text-[#0f2a1d]">M</div>
                      <h3 className="text-base font-bold">Mercadona</h3>
                    </div>
                    <div className="space-y-2">
                      {computedShoppingList.mercadona.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        return (
                          <button
                            key={item.id}
                            onClick={() => toggleCheck(item.id)}
                            className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${isChecked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                          >
                            <div className="flex items-center gap-3">
                              <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>
                                {isChecked ? '✓' : ''}
                              </span>
                              <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs font-bold text-black/90">{item.qtyText}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#fff4d6] flex items-center justify-center text-xs font-bold text-[#5a4100]">D</div>
                      <h3 className="text-base font-bold">Despensa / Otros</h3>
                    </div>
                    <div className="space-y-2">
                      {computedShoppingList.despensa.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        return (
                          <button
                            key={item.id}
                            onClick={() => toggleCheck(item.id)}
                            className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${isChecked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                          >
                            <div className="flex items-center gap-3">
                              <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>
                                {isChecked ? '✓' : ''}
                              </span>
                              <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs font-bold text-black/90">{item.qtyText}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </section>
            )}

            {activeTab === "logistica" && (
              <section className="space-y-5 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Recetario Dinámico Activo</h2>
                  <p className="text-sm text-black/70">Pasos de cocina para las variantes elegidas.</p>
                </div>

                <div className="space-y-3">
                  {baseDiet.meals.map((meal, idx) => {
                    const isOpen = openRecipe === idx;
                    const vIdx = activeVariants[meal.id] || 0;
                    const vData = meal.variants[vIdx] || meal.variants[0];

                    return (
                      <div key={idx} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-sm ring-1 ring-[#0f2a1d]/15' : 'border-[#e2e6e0]'}`}>
                        <button
                          onClick={() => setOpenRecipe(isOpen ? null : idx)}
                          className="w-full flex items-center justify-between p-4 text-left active:bg-black/5 transition"
                        >
                          <div>
                            <span className="text-[11px] font-bold text-[#0f2a1d] uppercase tracking-wider bg-[#eef2ec] px-2.5 py-1 rounded-md">{meal.label} ({meal.time})</span>
                            <h4 className="text-base font-bold text-[#1a2b1f] mt-1.5">{vData.title}</h4>
                          </div>
                          <span className={`text-xs text-black/40 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                        </button>

                        {isOpen && (
                          <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9] space-y-3 fade-in">
                            <div>
                              <h5 className="text-xs font-bold text-black/50 uppercase tracking-wider mb-1.5">Ingredientes:</h5>
                              <div className="flex flex-wrap gap-1.5">
                                {vData.foods.map((ing, i) => (
                                  <span key={i} className="bg-white border border-[#e2e6e0] text-xs font-semibold text-[#1a2b1f] px-2.5 py-1 rounded-lg">
                                    {ing.name} ({Math.round(ing.baseAmount * scaleFactor)}{ing.unit})
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div className="border-t border-[#f0f3ef] pt-2.5">
                              <h5 className="text-xs font-bold text-black/50 uppercase tracking-wider mb-1.5">Paso a paso:</h5>
                              <ol className="space-y-2 text-sm text-black/85 pl-4 list-decimal">
                                {vData.steps.map((step, sIdx) => (
                                  <li key={sIdx} className="leading-relaxed">{step}</li>
                                ))}
                              </ol>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {activeTab === "peso" && (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Control de Peso & Cloud</h2>
                  <p className="text-sm text-black/70">Sincronización en la carpeta Mi_Dieta_PWA.</p>
                </div>

                <form onSubmit={handleAddProfile} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3 shadow-2xs">
                  <h3 className="text-sm font-bold">Añadir Nuevo Perfil</h3>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Nombre..."
                      value={newProfileName}
                      onChange={(e) => setNewProfileName(e.target.value)}
                      className="flex-1 rounded-xl border border-[#e2e6e0] px-3.5 py-2.5 text-sm focus:outline-none focus:border-[#0f2a1d]"
                      required
                    />
                    <button type="submit" className="px-4 py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition">
                      Crear
                    </button>
                  </div>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 flex items-center justify-between gap-3 shadow-2xs">
                  <div>
                    <h3 className="text-sm font-bold text-[#0f2a1d]">Google Drive (Mi_Dieta_PWA)</h3>
                    <p className="text-xs text-black/60">{syncStatus || "Desconectado"}</p>
                  </div>
                  <button onClick={handleGoogleLogin} className="px-4 py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition">
                    Vincular Drive
                  </button>
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3 shadow-2xs">
                  <h3 className="text-sm font-bold">Registrar Peso para {currentProfile.name}</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-black/70 uppercase mb-1">Peso (kg)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="74.5"
                        value={currentWeightInput}
                        onChange={(e) => setCurrentWeightInput(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3.5 py-3 text-sm font-mono focus:outline-none focus:border-[#0f2a1d]"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-black/70 uppercase mb-1">Notas</label>
                      <input 
                        type="text" 
                        placeholder="Sensaciones..."
                        value={weightNote}
                        onChange={(e) => setWeightNote(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3.5 py-3 text-sm focus:outline-none focus:border-[#0f2a1d]"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-[#0f2a1d] text-white text-sm font-semibold hover:bg-black transition">
                    Guardar y Sincronizar
                  </button>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-4 shadow-2xs">
                  <h3 className="text-sm font-bold">Tendencia de Peso</h3>
                  <WeightChart logs={weightLogs} />
                  {weightLogs.length === 0 ? (
                    <p className="text-sm text-black/50 text-center py-2">Sin registros aún.</p>
                  ) : (
                    <div className="space-y-2 border-t border-[#f0f3ef] pt-3">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-3 rounded-xl bg-[#f8faf8] border border-[#f0f3ef] text-sm">
                          <div>
                            <span className="font-semibold">{log.date}</span>
                            <p className="text-black/60 text-xs mt-0.5">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-sm text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#e2e6e0] z-30">
            <div className="max-w mx-auto px-1 py-2 flex items-center justify-around">
              <button onClick={() => setActiveTab("dieta")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "dieta" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">🍱</span><span>Menú</span>
              </button>
              <button onClick={() => setActiveTab("alternativas")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "alternativas" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">⚡</span><span>Plan B</span>
              </button>
              <button onClick={() => setActiveTab("compra")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "compra" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">🛒</span><span>Compra</span>
              </button>
              <button onClick={() => setActiveTab("logistica")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "logistica" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">🍳</span><span>Cocina</span>
              </button>
              <button onClick={() => setActiveTab("peso")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "peso" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">📈</span><span>Drive</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  
</body>
</html>
