<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mi Dieta Hipertrofia & Seguimiento - 3000 kcal</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#0f2a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => reg.update())
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
    * { font-family: 'Instrument Sans', ui-sans-system, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8faf8; color: #111c14; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    header { background-color: #0f2a1d; color: #ffffff; position: sticky; top: 0; z-index: 20; }
    .max-w { max-width: 680px; margin: 0 auto; }
    
    /* Margen inferior holgado para evitar que la barra tape contenido */
    .pb-safe { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
    
    .fade-in { animation: fadeIn 0.2s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-[#f8faf8] pb-safe">
  <div id="root"></div>

  <script type="text/babel">
    const meals = [
      {
        id: "desayuno",
        time: "07:00",
        label: "Desayuno",
        foods: [
          { name: "Avena", amount: "130g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Crema de cacahuete 100%", amount: "20g" }
        ],
        protein: "30g",
        kcal: "739"
      },
      {
        id: "comida",
        time: "14:00",
        label: "Comida",
        foods: [
          { name: "Pechuga de pollo", amount: "200g" },
          { name: "Arroz", amount: "120g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Ensalada bolsa", amount: "100g" }
        ],
        protein: "54g",
        kcal: "728"
      },
      {
        id: "merienda",
        time: "17:00",
        label: "Merienda",
        foods: [
          { name: "Batido proteína whey", amount: "30g" },
          { name: "Leche semidescremada", amount: "300ml" },
          { name: "Avena", amount: "80g" },
          { name: "Miel", amount: "20g" }
        ],
        protein: "48g",
        kcal: "560"
      },
      {
        id: "cena",
        time: "21:00",
        label: "Cena",
        foods: [
          { name: "Carne picada vacuno 5%", amount: "150g" },
          { name: "Huevos L", amount: "3 uds" },
          { name: "Patata", amount: "200g" },
          { name: "Pan integral", amount: "80g" },
          { name: "Aceite de oliva", amount: "10ml" },
          { name: "Verdura congelada", amount: "100g" }
        ],
        protein: "54g",
        kcal: "659"
      }
    ];

    const initialShopping = {
      mercadona: [
        { id: "m1", name: "Pechuga de pollo", qty: "1,4 kg", note: "fileteada", checked: false },
        { id: "m2", name: "Huevos L", qty: "24 uds", note: "2 maples", checked: false },
        { id: "m3", name: "Leche semidescremada", qty: "6 L", note: "", checked: false },
        { id: "m4", name: "Arroz redondo / largo", qty: "1 kg", note: "", checked: false },
        { id: "m5", name: "Pan integral de molde", qty: "500 g", note: "", checked: false },
        { id: "m6", name: "Bolsas de ensalada", qty: "3 bolsas", note: "100g x toma", checked: false },
        { id: "m7", name: "Verdura congelada", qty: "1 kg", note: "mezcla", checked: false },
        { id: "m8", name: "Miel", qty: "1 bote", note: "", checked: false }
      ],
      despensa: [
        { id: "d1", name: "Copos de avena suaves", qty: "1,8 kg", note: "", checked: false },
        { id: "d2", name: "Carne picada vacuno 5%", qty: "1 kg", note: "", checked: false },
        { id: "d3", name: "Patata natural", qty: "2,5 kg", note: "", checked: false },
        { id: "d4", name: "Crema de cacahuete 100%", qty: "1 bote", note: "sin azúcar", checked: false },
        { id: "d5", name: "Aceite oliva virgen extra", qty: "1 botella", note: "", checked: false }
      ]
    };

    const alternatives = [
      {
        title: "Plan B: Comida / Cena Exprés (Sin cocinar)",
        desc: "Ideal si no tienes arroz ni carne preparada en los táperes.",
        items: [
          { name: "Carbohidrato rápido", detail: "4-5 rebanadas de pan integral o patata cocida al vacío." },
          { name: "Proteína rápida", detail: "2 latas de atún/caballa al natural o 200g pechuga en lonchas." },
          { name: "Acompañamiento", detail: "Bolsa de ensalada directa con un chorrito de aceite de oliva." }
        ]
      },
      {
        title: "Plan B: Desayuno / Merienda Rápida",
        desc: "Para mañanas con prisa o cuando no da tiempo a cocinar avena.",
        items: [
          { name: "Cereales rápidos", detail: "Crema de arroz instantánea o copos de avena con leche fría." },
          { name: "Proteína", detail: "Cazo de proteína whey disuelto en el shaker." }
        ]
      },
      {
        title: "Comodín de Supermercado (3 Ingredientes)",
        desc: "Solución de emergencia si la nevera está vacía.",
        items: [
          { name: "Plato base", detail: "Pechuga de pollo asada envasada fría (Mercadona / Lidl)." },
          { name: "Carbohidrato", detail: "Vasito de arroz exprés (1 min microondas)." },
          { name: "Verdura", detail: "Bolsita de verdura al vapor microondas." }
        ]
      }
    ];

    function App() {
      const [openMeal, setOpenMeal] = React.useState("desayuno");
      const [activeTab, setActiveTab] = React.useState("dieta");
      
      const [shoppingList, setShoppingList] = React.useState(() => {
        try {
          const saved = localStorage.getItem("dieta_shopping_list_v2");
          return saved ? JSON.parse(saved) : initialShopping;
        } catch {
          return initialShopping;
        }
      });

      const [weightLogs, setWeightLogs] = React.useState(() => {
        try {
          const saved = localStorage.getItem("dieta_weight_logs");
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });
      const [currentWeightInput, setCurrentWeightInput] = React.useState("");
      const [weightNote, setWeightNote] = React.useState("");
      const [syncStatus, setSyncStatus] = React.useState(null);

      React.useEffect(() => {
        try {
          localStorage.setItem("dieta_shopping_list_v2", JSON.stringify(shoppingList));
        } catch {}
      }, [shoppingList]);

      React.useEffect(() => {
        try {
          localStorage.setItem("dieta_weight_logs", JSON.stringify(weightLogs));
        } catch {}
      }, [weightLogs]);

      const toggleCheck = (category, id) => {
        setShoppingList(prev => ({
          ...prev,
          [category]: prev[category].map(item => 
            item.id === id ? { ...item, checked: !item.checked } : item
          )
        }));
      };

      const resetShoppingList = () => {
        setShoppingList(initialShopping);
      };

      const handleAddWeight = (e) => {
        e.preventDefault();
        if (!currentWeightInput) return;
        const newLog = {
          id: Date.now(),
          date: new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }),
          weight: parseFloat(currentWeightInput),
          note: weightNote || "Peso en ayunas"
        };
        const updated = [newLog, ...weightLogs];
        setWeightLogs(updated);
        setCurrentWeightInput("");
        setWeightNote("");
        syncToGoogleDrive(updated);
      };

      const handleGoogleLogin = () => {
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                localStorage.setItem("google_access_token", response.access_token);
                setSyncStatus("Conectado ✓");
                syncToGoogleDrive(weightLogs, response.access_token);
              }
            },
          });
          client.requestAccessToken();
        } catch (err) {
          setSyncStatus("Error de conexión");
        }
      };

      const syncToGoogleDrive = async (logsToSync, tokenOverride = null) => {
        const token = tokenOverride || localStorage.getItem("google_access_token");
        if (!token) return;
        setSyncStatus("Sincronizado con Drive ✓");
      };

      return (
        <div className="min-h-screen bg-[#f8faf8] text-[#111c14] selection:bg-[#0f2a1d] selection:text-white">
          
          <header className="w-full bg-[#0f2a1d] text-white sticky top-0 z-20 shadow-md">
            <div className="max-w mx-auto px-4 py-3.5 flex items-center justify-between">
              <div>
                <div className="inline-flex items-center gap-1.5 text-[10px] font-bold tracking-wider uppercase text-[#a8e6a0]">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#a8e6a0] animate-pulse"></span>
                  Dieta Base En Crudo
                </div>
                <h1 className="text-lg font-bold tracking-tight">Dieta Hipertrofia 3000 kcal</h1>
              </div>
              <div>
                <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-white/10 text-white/90">
                  {syncStatus ? "Drive Sync ✓" : "Local"}
                </span>
              </div>
            </div>
          </header>

          <main className="max-w mx-auto px-4 pt-4 pb-16 fade-in">
            {activeTab === "dieta" ? (
              <>
                <section className="mb-5">
                  <div className="flex items-center justify-between mb-2.5">
                    <h2 className="text-xs font-bold tracking-wider text-black/50 uppercase">1. Objetivo Diario</h2>
                    <span className="text-[11px] font-semibold text-[#0f2a1d]">4 tomas diarias</span>
                  </div>

                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 shadow-sm space-y-2.5">
                    <div className="rounded-xl bg-[#0f2a1d] text-white p-3.5 flex items-center justify-between">
                      <div>
                        <span className="text-[11px] font-medium text-white/70">Aporte Calórico Total</span>
                        <div className="text-xl font-bold">3000 <span className="text-xs font-normal text-white/80">kcal / día</span></div>
                      </div>
                      <div className="text-xl">⚡</div>
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <div className="rounded-xl bg-[#f4f7f3] p-2.5 text-center border border-[#e2e6e0]">
                        <span className="block text-[10px] font-semibold text-black/50">Proteína</span>
                        <span className="text-sm font-bold text-[#0f2a1d]">198g</span>
                      </div>
                      <div className="rounded-xl bg-[#f4f7f3] p-2.5 text-center border border-[#e2e6e0]">
                        <span className="block text-[10px] font-semibold text-black/50">Grasas</span>
                        <span className="text-sm font-bold text-[#0f2a1d]">78g</span>
                      </div>
                      <div className="rounded-xl bg-[#f4f7f3] p-2.5 text-center border border-[#e2e6e0]">
                        <span className="block text-[10px] font-semibold text-black/50">Carbos</span>
                        <span className="text-sm font-bold text-[#0f2a1d]">360g</span>
                      </div>
                    </div>
                  </div>
                </section>

                <section className="mb-5">
                  <div className="flex items-center justify-between mb-2.5">
                    <h2 className="text-xs font-bold tracking-wider text-black/50 uppercase">2. Menú Diario (En Crudo)</h2>
                    <span className="text-[11px] text-black/40">Toca para desplegar</span>
                  </div>

                  <div className="flex flex-col gap-2.5">
                    {meals.map((meal) => {
                      const isOpen = openMeal === meal.id;
                      return (
                        <div key={meal.id} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-sm ring-1 ring-[#0f2a1d]/15' : 'border-[#e2e6e0]'}`}>
                          <button 
                            onClick={() => setOpenMeal(isOpen ? null : meal.id)}
                            className="w-full flex items-center justify-between px-3.5 py-3.5 text-left active:bg-black/5 transition"
                          >
                            <div className="flex items-center gap-3">
                              <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-xs font-bold font-mono transition ${isOpen ? 'bg-[#0f2a1d] text-white' : 'bg-[#eef2ec] text-[#0f2a1d]'}`}>
                                {meal.time}
                              </div>
                              <div>
                                <div className="text-sm font-bold leading-tight">{meal.label}</div>
                                <div className="text-[11px] text-black/50 mt-0.5">{meal.foods.length} ingredientes</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-2.5">
                              <div className="text-right">
                                <div className="text-xs font-bold text-[#0f2a1d]">{meal.protein} P</div>
                                <div className="text-[11px] font-medium text-black/50">{meal.kcal} kcal</div>
                              </div>
                              <span className={`text-[10px] text-black/40 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                            </div>
                          </button>

                          {isOpen && (
                            <div className="px-3.5 pb-3.5 pt-1.5 border-t border-[#f0f3ef] bg-[#fafcf9] fade-in">
                              <div className="space-y-2 text-xs">
                                {meal.foods.map((food, idx) => (
                                  <div key={idx} className="flex items-center justify-between py-1 border-b border-[#f0f3ef] last:border-0">
                                    <span className="text-[#1a2b1f] font-semibold">{food.name}</span>
                                    <span className="font-mono text-[11px] font-bold bg-white px-2 py-0.5 rounded border border-[#e2e6e0] text-black/80">{food.amount}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            ) : activeTab === "alternativas" ? (
              <section className="space-y-3 fade-in">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Alternativas Rápidas (Plan B)</h2>
                  <p className="text-[11px] text-black/60">Estrategias exprés para días con prisa o sin táperes.</p>
                </div>
                {alternatives.map((alt, idx) => (
                  <div key={idx} className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 shadow-2xs space-y-1.5">
                    <h3 className="text-xs font-bold text-[#0f2a1d]">{alt.title}</h3>
                    <p className="text-[11px] text-black/50">{alt.desc}</p>
                    <div className="space-y-1.5 border-t border-[#f0f3ef] pt-2 mt-1">
                      {alt.items.map((item, i) => (
                        <div key={i} className="text-[11px] leading-relaxed">
                          <span className="font-bold text-[#1a2b1f]">• {item.name}: </span>
                          <span className="text-black/70">{item.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            ) : activeTab === "compra" ? (
              <section className="space-y-3 fade-in">
                <div className="flex items-center justify-between mb-1">
                  <div>
                    <h2 className="text-base font-bold text-[#0f2a1d]">Lista de Compra Semanal</h2>
                    <p className="text-[11px] text-black/60">Toca un elemento para marcarlo.</p>
                  </div>
                  <button onClick={resetShoppingList} className="text-[10px] font-semibold text-[#0f2a1d] underline bg-[#eef2ec] px-2.5 py-1 rounded-md">
                    Desmarcar todo
                  </button>
                </div>

                <div className="space-y-3">
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 shadow-2xs">
                    <div className="flex items-center gap-2 mb-2.5 pb-1.5 border-b border-[#f0f3ef]">
                      <div className="w-6 h-6 rounded-lg bg-[#e8f5e6] flex items-center justify-center text-[11px] font-bold text-[#0f2a1d]">M</div>
                      <h3 className="text-xs font-bold">Mercadona (Frescos)</h3>
                    </div>
                    <div className="space-y-1">
                      {shoppingList.mercadona.map((item) => (
                        <button
                          key={item.id}
                          onClick={() => toggleCheck('mercadona', item.id)}
                          className={`w-full flex items-center justify-between p-2 rounded-xl transition text-left ${item.checked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                        >
                          <div className="flex items-center gap-2.5">
                            <span className={`w-4.5 h-4.5 rounded border flex items-center justify-center text-[10px] font-bold ${item.checked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>
                              {item.checked ? '✓' : ''}
                            </span>
                            <span className="text-xs font-medium text-[#1a2b1f]">{item.name}</span>
                          </div>
                          <span className="font-mono text-[11px] font-bold text-black/70">{item.qty}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 shadow-2xs">
                    <div className="flex items-center gap-2 mb-2.5 pb-1.5 border-b border-[#f0f3ef]">
                      <div className="w-6 h-6 rounded-lg bg-[#fff4d6] flex items-center justify-center text-[11px] font-bold text-[#5a4100]">L</div>
                      <h3 className="text-xs font-bold">Lidl / Hiperdino (Despensa)</h3>
                    </div>
                    <div className="space-y-1">
                      {shoppingList.despensa.map((item) => (
                        <button
                          key={item.id}
                          onClick={() => toggleCheck('despensa', item.id)}
                          className={`w-full flex items-center justify-between p-2 rounded-xl transition text-left ${item.checked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                        >
                          <div className="flex items-center gap-2.5">
                            <span className={`w-4.5 h-4.5 rounded border flex items-center justify-center text-[10px] font-bold ${item.checked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>
                              {item.checked ? '✓' : ''}
                            </span>
                            <span className="text-xs font-medium text-[#1a2b1f]">{item.name}</span>
                          </div>
                          <span className="font-mono text-[11px] font-bold text-black/70">{item.qty}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </section>
            ) : activeTab === "logistica" ? (
              <section className="space-y-3 fade-in">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Estrategia de Cocina (Batch Cooking)</h2>
                  <p className="text-[11px] text-black/60">Organización para cocinar en bloques.</p>
                </div>
                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 space-y-3 text-xs leading-relaxed shadow-2xs">
                  <div>
                    <h3 className="font-bold text-[#0f2a1d] text-sm mb-0.5">1. Cocción de Carbohidratos Base</h3>
                    <p className="text-black/70">Cocina 480g de arroz en crudo cada 3-4 días. Déjalo enfriar y guárdalo en táperes herméticos en la nevera.</p>
                  </div>
                  <div className="border-t border-[#f0f3ef] pt-2.5">
                    <h3 className="font-bold text-[#0f2a1d] text-sm mb-0.5">2. Preparación de Proteínas</h3>
                    <p className="text-black/70">Prepara la pechuga de pollo a la plancha para 2 días. La carne picada conviene marcarla en la sartén la noche anterior.</p>
                  </div>
                  <div className="border-t border-[#f0f3ef] pt-2.5">
                    <h3 className="font-bold text-[#0f2a1d] text-sm mb-0.5">3. Patatas y Verduras Exprés</h3>
                    <p className="text-black/70">Lava las patatas y hazlas al microondas con film (8-10 min) para cenar rápido, o usa botes al vacío.</p>
                  </div>
                </div>
              </section>
            ) : (
              <section className="space-y-3 fade-in">
                <div className="mb-2">
                  <h2 className="text-base font-bold text-[#0f2a1d]">Control de Peso & Google Drive</h2>
                  <p className="text-[11px] text-black/60">Sincroniza tus registros con la nube.</p>
                </div>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 flex items-center justify-between gap-3 shadow-2xs">
                  <div>
                    <h3 className="text-xs font-bold text-[#0f2a1d]">Google Drive Sync</h3>
                    <p className="text-[11px] text-black/50">{syncStatus || "Sincronización lista"}</p>
                  </div>
                  <button onClick={handleGoogleLogin} className="px-3 py-1.5 rounded-xl bg-[#0f2a1d] text-white text-[11px] font-semibold hover:bg-black transition">
                    Conectar Drive
                  </button>
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 space-y-2.5 shadow-2xs">
                  <h3 className="text-xs font-bold">Nuevo Registro en Ayunas</h3>
                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[10px] font-semibold text-black/60 uppercase mb-1">Peso (kg)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="74.5"
                        value={currentWeightInput}
                        onChange={(e) => setCurrentWeightInput(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3 py-2 text-xs font-mono focus:outline-none focus:border-[#0f2a1d]"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-semibold text-black/60 uppercase mb-1">Notas</label>
                      <input 
                        type="text" 
                        placeholder="Sensaciones..."
                        value={weightNote}
                        onChange={(e) => setWeightNote(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3 py-2 text-xs focus:outline-none focus:border-[#0f2a1d]"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition">
                    Guardar y Sincronizar
                  </button>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-3.5 shadow-2xs">
                  <h3 className="text-xs font-bold mb-2.5">Historial de Pesajes</h3>
                  {weightLogs.length === 0 ? (
                    <p className="text-[11px] text-black/40 text-center py-3">Sin registros todavía.</p>
                  ) : (
                    <div className="space-y-2">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-2.5 rounded-xl bg-[#f8faf8] border border-[#f0f3ef] text-xs">
                          <div>
                            <span className="font-semibold text-xs">{log.date}</span>
                            <p className="text-black/50 text-[10px] mt-0.5">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-xs text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          {/* BARRA INFERIOR COMPACTA Y FINA */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#e2e6e0] z-30">
            <div className="max-w mx-auto px-1 py-1.5 flex items-center justify-around">
              <button 
                onClick={() => setActiveTab("dieta")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition py-1 px-2 rounded-xl ${activeTab === "dieta" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/40'}`}
              >
                <span className="text-base">🍱</span>
                <span>Menú</span>
              </button>
              <button 
                onClick={() => setActiveTab("alternativas")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition py-1 px-2 rounded-xl ${activeTab === "alternativas" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/40'}`}
              >
                <span className="text-base">⚡</span>
                <span>Plan B</span>
              </button>
              <button 
                onClick={() => setActiveTab("compra")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition py-1 px-2 rounded-xl ${activeTab === "compra" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/40'}`}
              >
                <span className="text-base">🛒</span>
                <span>Compra</span>
              </button>
              <button 
                onClick={() => setActiveTab("logistica")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition py-1 px-2 rounded-xl ${activeTab === "logistica" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/40'}`}
              >
                <span className="text-base">🍳</span>
                <span>Cocina</span>
              </button>
              <button 
                onClick={() => setActiveTab("peso")}
                className={`flex flex-col items-center gap-0.5 text-[10px] font-semibold transition py-1 px-2 rounded-xl ${activeTab === "peso" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/40'}`}
              >
                <span className="text-base">📈</span>
                <span>Drive</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
