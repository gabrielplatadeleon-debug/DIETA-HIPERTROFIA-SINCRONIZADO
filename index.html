            },
          });
          client.requestAccessToken();
        } catch (err) {
          console.error("Error OAuth:", err);
        }
      },

      async getOrCreateUserFolder(token, folderName) {
        try {
          const cleanName = folderName || "Mi_Dieta_PWA_Personal";
          const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='${cleanName}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
          const res = await fetch(searchUrl, { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          if (data.files && data.files.length > 0) return data.files[0].id;

          const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ name: cleanName, mimeType: "application/vnd.google-apps.folder" })
          });
          const folderData = await createRes.json();
          return folderData.id;
        } catch {
          return null;
        }
      },

      async syncCloudProfile(token, userFolder, profilePayload) {
        if (!token) return { success: false };
        try {
          const folderId = await this.getOrCreateUserFolder(token, userFolder);
          if (!folderId) return { success: false };

          const fileName = `datos_dieta_${profilePayload.profile.id}.json`;
          const blob = new Blob([JSON.stringify(profilePayload, null, 2)], { type: "application/json" });

          const searchUrl = `https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and '${folderId}' in parents and trashed=false`;
          const searchRes = await fetch(searchUrl, { headers: { Authorization: `Bearer ${token}` } });
          const searchData = await searchRes.json();

          if (searchData.files && searchData.files.length > 0) {
            await fetch(`https://www.googleapis.com/upload/drive/v3/files/${searchData.files[0].id}?uploadType=media`, {
              method: "PATCH",
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
              body: blob
            });
          } else {
            const metadata = { name: fileName, parents: [folderId], mimeType: "application/json" };
            const form = new FormData();
            form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
            form.append("file", blob);
            await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
              method: "POST",
              headers: { Authorization: `Bearer ${token}` },
              body: form
            });
          }
          return { success: true };
        } catch (err) {
          return { success: false };
        }
      }
    };

    /* ==========================================
       CAPA 3: GRÁFICA DE PESO SVG NATIVA
       ========================================== */
    function WeightChart({ logs }) {
      if (!logs || logs.length < 2) {
        return <div className="p-4 text-center text-xs text-black/50 bg-[#f8faf8] rounded-xl border border-[#f0f3ef]">Registra al menos 2 pesajes para ver la gráfica.</div>;
      }
      const sortedLogs = [...logs].reverse();
      const weights = sortedLogs.map(l => l.weight);
      const minW = Math.min(...weights) - 0.5;
      const maxW = Math.max(...weights) + 0.5;
      const range = maxW - minW || 1;

      const height = 120;
      const width = 300;
      const padding = 20;

      const points = sortedLogs.map((log, i) => {
        const x = padding + (i / (sortedLogs.length - 1)) * (width - padding * 2);
        const y = height - padding - ((log.weight - minW) / range) * (height - padding * 2);
        return { x, y, weight: log.weight };
      });

      const pathD = points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, "");

      return (
        <div className="space-y-2">
          <div className="flex items-center justify-between text-xs font-semibold text-black/60">
            <span>Mín: {minW.toFixed(1)} kg</span>
            <span className="text-[#0f2a1d] font-bold">Evolución de Peso</span>
            <span>Máx: {maxW.toFixed(1)} kg</span>
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-32 overflow-visible">
            <path d={pathD} fill="none" stroke="#0f2a1d" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            {points.map((p, i) => (
              <g key={i}>
                <circle cx={p.x} cy={p.y} r="4" fill="#0f2a1d" />
                <text x={p.x} y={p.y - 8} textAnchor="middle" className="text-[9px] font-mono font-bold fill-[#0f2a1d]">{p.weight}</text>
              </g>
            ))}
          </svg>
        </div>
      );
    }

                    </button>

                    {(FOOD_SUBSTITUTES[substitutionModal.food.group] || []).map((sub, idx) => {
                      const isSelected = substitutionModal.activeSub?.name === sub.name;
                      const calculatedQty = Math.round(substitutionModal.food.baseAmount * sub.factor * scaleFactor);

                      return (
                        <button
                          key={idx}
                          onClick={() => handleSubstituteFood(substitutionModal.food.id, sub)}
                          className={`w-full text-left p-3 rounded-xl border text-xs flex items-center justify-between transition ${isSelected ? 'border-[#0f2a1d] bg-[#0f2a1d] text-white' : 'border-[#e2e6e0] bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                        >
                          <div>
                            <div className="font-bold">{sub.name} <span className="text-[10px] opacity-75">({sub.supermarket})</span></div>
                          </div>
                          <span className="font-mono font-bold text-sm">{calculatedQty}{sub.unit}</span>
                        </button>
                      );
                    })}
                  </div>

                  <button onClick={() => setSubstitutionModal(null)} className="w-full py-3 rounded-xl bg-[#eef2ec] text-[#0f2a1d] text-xs font-bold">
                    Cerrar
                  </button>
                </div>
              </div>
            )}

            {/* SECCIÓN 2: PLAN B */}
            {activeTab === "alternativas" && (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Plan B: Soluciones Exprés</h2>
                  <p className="text-sm text-black/70">Alternativas rápidas sin cocinar para días con prisa.</p>
                </div>

                {PLAN_B_DATA.map((plan) => (
                  <div key={plan.id} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs space-y-3">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">⚡</span>
                      <h3 className="text-base font-bold text-[#0f2a1d]">{plan.title}</h3>
                    </div>
                    <p className="text-xs text-black/60 leading-relaxed">{plan.desc}</p>
                    
                    <div className="space-y-2 border-t border-[#f0f3ef] pt-3">
                      {plan.options.map((opt, oIdx) => (
                        <div key={oIdx} className="p-2.5 rounded-xl bg-[#f8faf8] border border-[#f0f3ef] text-xs">
                          <span className="font-bold text-[#0f2a1d] block mb-0.5">• {opt.name}</span>
                          <span className="text-black/80">{opt.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            )}

            {/* SECCIÓN 3: COMPRA OPTIMIZADA POR SUPERMERCADOS EN ESPAÑA */}
            {activeTab === "compra" && (
              <section className="space-y-4 fade-in">
                <div className="flex items-center justify-between mb-1">
                  <div>
                    <h2 className="text-xl font-bold text-[#0f2a1d]">Optimizador de Supermercados</h2>
                    <p className="text-sm text-black/70">Lista de compra semanal distribuida por cadena (España).</p>
                  </div>
                  <button onClick={resetShoppingList} className="text-xs font-semibold text-[#0f2a1d] underline bg-[#eef2ec] px-3.5 py-2 rounded-xl">
                    Desmarcar todo
                  </button>
                </div>

                <div className="space-y-4">
                  {/* MERCADONA */}
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#e8f5e6] flex items-center justify-center text-xs font-bold text-[#0f2a1d]">M</div>
                      <h3 className="text-base font-bold">Mercadona (Frescos & Marca Blanca)</h3>
                    </div>
                    <div className="space-y-2">
                      {computedSupermarketList.mercadona.length === 0 ? <p className="text-xs text-black/40 italic">Sin productos en esta sección.</p> : computedSupermarketList.mercadona.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        return (
                          <button key={item.id} onClick={() => toggleCheck(item.id)} className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${isChecked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}>
                            <div className="flex items-center gap-3">
                              <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>{isChecked ? '✓' : ''}</span>
                              <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs font-bold text-black/90">{item.qtyText}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* LIDL */}
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#fff4d6] flex items-center justify-center text-xs font-bold text-[#5a4100]">L</div>
                      <h3 className="text-base font-bold">Lidl (Frutos Secos, Lácteos & Proteína)</h3>
                    </div>
                    <div className="space-y-2">
                      {computedSupermarketList.lidl.length === 0 ? <p className="text-xs text-black/40 italic">Sin productos en esta sección.</p> : computedSupermarketList.lidl.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        return (
                          <button key={item.id} onClick={() => toggleCheck(item.id)} className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${isChecked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}>
                            <div className="flex items-center gap-3">
                              <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>{isChecked ? '✓' : ''}</span>
                              <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs font-bold text-black/90">{item.qtyText}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* HIPERDINO */}
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#e3f2fd] flex items-center justify-center text-xs font-bold text-[#0d47a1]">H</div>
                      <h3 className="text-base font-bold">Hiperdino (Aceites, Frutas & Patatas)</h3>
                    </div>
                    <div className="space-y-2">
                      {computedSupermarketList.hiperdino.length === 0 ? <p className="text-xs text-black/40 italic">Sin productos en esta sección.</p> : computedSupermarketList.hiperdino.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        return (
                          <button key={item.id} onClick={() => toggleCheck(item.id)} className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${isChecked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}>
                            <div className="flex items-center gap-3">
                              <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>{isChecked ? '✓' : ''}</span>
                              <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs font-bold text-black/90">{item.qtyText}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* CARREFOUR */}
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#ffebee] flex items-center justify-center text-xs font-bold text-[#b71c1c]">C</div>
                      <h3 className="text-base font-bold">Carrefour (Carnes, Panadería & Despensa)</h3>
                    </div>
                    <div className="space-y-2">
                      {computedSupermarketList.carrefour.length === 0 ? <p className="text-xs text-black/40 italic">Sin productos en esta sección.</p> : computedSupermarketList.carrefour.map((item) => {
                        const isChecked = !!checkedItems[item.id];
                        return (
                          <button key={item.id} onClick={() => toggleCheck(item.id)} className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${isChecked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}>
                            <div className="flex items-center gap-3">
                              <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${isChecked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>{isChecked ? '✓' : ''}</span>
                              <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                            </div>
                            <span className="font-mono text-xs font-bold text-black/90">{item.qtyText}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                </div>
              </section>
            )}

            {/* SECCIÓN 4: COCINA */}
            {activeTab === "logistica" && (
              <section className="space-y-5 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Recetario Dinámico Activo</h2>
                  <p className="text-sm text-black/70">Paso a paso para las variantes e ingredientes elegidos.</p>
                </div>

                <div className="space-y-3">
                  {activeDiet.meals.map((meal, idx) => {
                    const isOpen = openRecipe === idx;
                    const vIdx = activeVariants[meal.id] || 0;
                    const vData = meal.variants[vIdx] || meal.variants[0];

                    return (
                      <div key={idx} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-sm ring-1 ring-[#0f2a1d]/15' : 'border-[#e2e6e0]'}`}>
                        <button
                          onClick={() => setOpenRecipe(isOpen ? null : idx)}
                          className="w-full flex items-center justify-between p-4 text-left active:bg-black/5 transition"
                        >
                          <div>
                            <span className="text-[11px] font-bold text-[#0f2a1d] uppercase tracking-wider bg-[#eef2ec] px-2.5 py-1 rounded-md">{meal.label} ({meal.time})</span>
                            <h4 className="text-base font-bold text-[#1a2b1f] mt-1.5">{vData.title}</h4>
                          </div>
                          <span className={`text-xs text-black/40 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                        </button>

                        {isOpen && (
                          <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9] space-y-3 fade-in">
                            <div>
                              <h5 className="text-xs font-bold text-black/50 uppercase tracking-wider mb-1.5">Ingredientes Adaptados:</h5>
                              <div className="flex flex-wrap gap-1.5">
                                {vData.foods.map((ing, i) => {
                                  const sub = foodSubstitutions[ing.id];
                                  const ingName = sub ? sub.name : ing.name;
                                  const factor = sub ? sub.factor : 1.0;
                                  const unit = sub ? sub.unit : ing.unit;
                                  const qty = Math.round(ing.baseAmount * factor * scaleFactor);

                                  return (
                                    <span key={i} className="bg-white border border-[#e2e6e0] text-xs font-semibold text-[#1a2b1f] px-2.5 py-1 rounded-lg">
                                      {ingName} ({qty}{unit})
                                    </span>
                                  );
                                })}
                              </div>
                            </div>
                            <div className="border-t border-[#f0f3ef] pt-2.5">
                              <h5 className="text-xs font-bold text-black/50 uppercase tracking-wider mb-1.5">Paso a paso:</h5>
                              <ol className="space-y-2 text-sm text-black/85 pl-4 list-decimal">
                                {vData.steps.map((step, sIdx) => (
                                  <li key={sIdx} className="leading-relaxed">{step}</li>
                                ))}
                              </ol>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {/* SECCIÓN 5: VINCULACIÓN DRIVE & PESO */}
            {activeTab === "peso" && (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Vinculación Gmail & Google Drive</h2>
                  <p className="text-sm text-black/70">Sincronización en tiempo real con tu carpeta personal.</p>
                </div>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3 shadow-2xs">
                  <h3 className="text-sm font-bold text-[#0f2a1d]">Cuenta de Google Activa</h3>
                  {googleUser ? (
                    <div className="p-3 bg-[#f4f7f3] rounded-xl border border-[#e2e6e0] flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-[#0f2a1d] text-white font-bold flex items-center justify-center text-sm">
                        {googleUser.given_name ? googleUser.given_name[0] : 'G'}
                      </div>
                      <div>
                        <div className="text-sm font-bold">{googleUser.name}</div>
                        <div className="text-xs text-black/60">{googleUser.email}</div>
                        <div className="text-[10px] text-[#0f2a1d] font-semibold mt-0.5">Carpeta: Mi_Dieta_PWA_{googleUser.given_name || 'Personal'}</div>
                      </div>
                    </div>
                  ) : (
                    <button onClick={handleGoogleLogin} className="w-full py-3.5 rounded-xl bg-[#0f2a1d] text-white text-sm font-semibold hover:bg-black transition flex items-center justify-center gap-2">
                      <span>🔑</span>
                      <span>Vincular con Cuenta de Google / Gmail</span>
                    </button>
                  )}
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3 shadow-2xs">
                  <h3 className="text-sm font-bold">Registrar Peso Diario</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-black/70 uppercase mb-1">Peso (kg)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="74.5"
                        value={currentWeightInput}
                        onChange={(e) => setCurrentWeightInput(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3.5 py-3 text-sm font-mono focus:outline-none focus:border-[#0f2a1d]"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-black/70 uppercase mb-1">Notas</label>
                      <input 
                        type="text" 
                        placeholder="Sensaciones..."
                        value={weightNote}
                        onChange={(e) => setWeightNote(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3.5 py-3 text-sm focus:outline-none focus:border-[#0f2a1d]"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-[#0f2a1d] text-white text-sm font-semibold hover:bg-black transition">
                    Guardar y Sincronizar en Drive Personal
                  </button>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-4 shadow-2xs">
                  <h3 className="text-sm font-bold">Evolución de Peso</h3>
                  <WeightChart logs={weightLogs} />
                  {weightLogs.length === 0 ? (
                    <p className="text-sm text-black/50 text-center py-2">Sin registros aún.</p>
                  ) : (
                    <div className="space-y-2 border-t border-[#f0f3ef] pt-3">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-3 rounded-xl bg-[#f8faf8] border border-[#f0f3ef] text-sm">
                          <div>
                            <span className="font-semibold">{log.date}</span>
                            <p className="text-black/60 text-xs mt-0.5">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-sm text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#e2e6e0] z-30">
            <div className="max-w mx-auto px-1 py-2 flex items-center justify-around">
              <button onClick={() => setActiveTab("dieta")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "dieta" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">🍱</span><span>Menú</span>
              </button>
              <button onClick={() => setActiveTab("alternativas")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "alternativas" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">⚡</span><span>Plan B</span>
              </button>
              <button onClick={() => setActiveTab("compra")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "compra" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">🛒</span><span>Compra</span>
              </button>
              <button onClick={() => setActiveTab("logistica")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "logistica" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">🍳</span><span>Cocina</span>
              </button>
              <button onClick={() => setActiveTab("peso")} className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "peso" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}>
                <span className="text-lg">📈</span><span>Drive</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
