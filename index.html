<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Mi Dieta Hipertrofia & Seguimiento - 3000 kcal</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#0f2a1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => reg.update())
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
    * { font-family: 'Instrument Sans', ui-sans-system, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8faf8; color: #111c14; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    header { background-color: #0f2a1d; color: #ffffff; position: sticky; top: 0; z-index: 20; }
    .max-w { max-width: 680px; margin: 0 auto; }
    .pb-safe { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
    .fade-in { animation: fadeIn 0.2s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-[#f8faf8] pb-safe">
  <div id="root"></div>

  <script type="text/babel">
    /* ==========================================
       CAPA 1: DATOS Y CONSTANTES DE NEGOCIO
       ========================================== */
    const APP_VERSION = "v5.3-ESCALADOR";

    const DEFAULT_PROFILE = {
      id: "principal",
      name: "Usuario Principal",
      baseKcal: 3000
    };

    const BASE_MEALS_DATA = [
      {
        id: "desayuno",
        time: "07:00",
        label: "Desayuno",
        baseFoods: [
          { name: "Avena", baseAmount: 130, unit: "g" },
          { name: "Leche semidescremada", baseAmount: 300, unit: "ml" },
          { name: "Crema de cacahuete 100%", baseAmount: 20, unit: "g" }
        ],
        baseProtein: 30,
        baseKcal: 739
      },
      {
        id: "comida",
        time: "14:00",
        label: "Comida",
        baseFoods: [
          { name: "Pechuga de pollo", baseAmount: 200, unit: "g" },
          { name: "Arroz", baseAmount: 120, unit: "g" },
          { name: "Aceite de oliva", baseAmount: 10, unit: "ml" },
          { name: "Ensalada bolsa", baseAmount: 100, unit: "g" }
        ],
        baseProtein: 54,
        baseKcal: 728
      },
      {
        id: "merienda",
        time: "17:00",
        label: "Merienda",
        baseFoods: [
          { name: "Batido proteína whey", baseAmount: 30, unit: "g" },
          { name: "Leche semidescremada", baseAmount: 300, unit: "ml" },
          { name: "Avena", baseAmount: 80, unit: "g" },
          { name: "Miel", baseAmount: 20, unit: "g" }
        ],
        baseProtein: 48,
        baseKcal: 560
      },
      {
        id: "cena",
        time: "21:00",
        label: "Cena",
        baseFoods: [
          { name: "Carne picada vacuno 5%", baseAmount: 150, unit: "g" },
          { name: "Huevos L", baseAmount: 3, unit: "uds" },
          { name: "Patata", baseAmount: 200, unit: "g" },
          { name: "Pan integral", baseAmount: 80, unit: "g" },
          { name: "Aceite de oliva", baseAmount: 10, unit: "ml" },
          { name: "Verdura congelada", baseAmount: 100, unit: "g" }
        ],
        baseProtein: 54,
        baseKcal: 659
      }
    ];

    const INITIAL_SHOPPING_LIST = {
      mercadona: [
        { id: "m1", name: "Pechuga de pollo", qty: "1,4 kg", note: "fileteada", checked: false },
        { id: "m2", name: "Huevos L", qty: "24 uds", note: "2 maples", checked: false },
        { id: "m3", name: "Leche semidescremada", qty: "6 L", note: "", checked: false },
        { id: "m4", name: "Arroz redondo / largo", qty: "1 kg", note: "", checked: false },
        { id: "m5", name: "Pan integral de molde", qty: "500 g", note: "", checked: false },
        { id: "m6", name: "Bolsas de ensalada", qty: "3 bolsas", note: "100g x toma", checked: false },
        { id: "m7", name: "Verdura congelada", qty: "1 kg", note: "mezcla", checked: false },
        { id: "m8", name: "Miel", qty: "1 bote", note: "", checked: false }
      ],
      despensa: [
        { id: "d1", name: "Copos de avena suaves", qty: "1,8 kg", note: "", checked: false },
        { id: "d2", name: "Carne picada vacuno 5%", qty: "1 kg", note: "", checked: false },
        { id: "d3", name: "Patata natural", qty: "2,5 kg", note: "", checked: false },
        { id: "d4", name: "Crema de cacahuete 100%", qty: "1 bote", note: "sin azúcar", checked: false },
        { id: "d5", name: "Aceite oliva virgen extra", qty: "1 botella", note: "", checked: false }
      ]
    };

    const ALTERNATIVES_DATA = [
      {
        title: "Plan B: Comida / Cena Exprés (Sin cocinar)",
        desc: "Ideal si no tienes arroz ni carne preparada en los táperes.",
        items: [
          { name: "Carbohidrato rápido", detail: "4-5 rebanadas de pan integral o patata cocida al vacío." },
          { name: "Proteína rápida", detail: "2 latas de atún/caballa al natural o 200g pechuga en lonchas." },
          { name: "Acompañamiento", detail: "Bolsa de ensalada directa con un chorrito de aceite de oliva." }
        ]
      },
      {
        title: "Plan B: Desayuno / Merienda Rápida",
        desc: "Para mañanas con prisa o cuando no da tiempo a cocinar avena.",
        items: [
          { name: "Cereales rápidos", detail: "Crema de arroz instantánea o copos de avena con leche fría." },
          { name: "Proteína", detail: "Cazo de proteína whey disuelto en el shaker." }
        ]
      },
      {
        title: "Comodín de Supermercado (3 Ingredientes)",
        desc: "Solución de emergencia si la nevera está vacía.",
        items: [
          { name: "Plato base", detail: "Pechuga de pollo asada envasada fría (Mercadona / Lidl)." },
          { name: "Carbohidrato", detail: "Vasito de arroz exprés (1 min microondas)." },
          { name: "Verdura", detail: "Bolsita de verdura al vapor microondas." }
        ]
      }
    ];

    const RECIPES_DATA = [
      {
        title: "Gachas Proteicas de Avena (Desayuno)",
        target: "Desayuno (07:00)",
        ingredients: ["Avena", "Leche semidescremada", "Crema de cacahuete"],
        steps: [
          "Calienta la leche en un bol o cazo durante 2 minutos.",
          "Añade los gramos correspondientes de copos de avena y remueve bien.",
          "Integra la crema de cacahuete en caliente para que se funda y aporte textura cremosa."
        ]
      },
      {
        title: "Arroz Salteado con Pollo en Crudo (Comida)",
        target: "Comida (14:00)",
        ingredients: ["Pechuga de pollo", "Arroz", "Aceite de oliva", "Ensalada"],
        steps: [
          "Cocina el arroz previamente por lotes (batch cooking) o ponlo a hervir.",
          "Corta la pechuga de pollo en dados y dórala en la sartén con el aceite de oliva.",
          "Mezcla el arroz con el pollo caliente y acompaña con la ensalada fresca."
        ]
      },
      {
        title: "Batido Hipercalórico de Avena y Whey (Merienda)",
        target: "Merienda (17:00)",
        ingredients: ["Proteína Whey", "Leche semidescremada", "Avena", "Miel"],
        steps: [
          "Introduce la avena en la batidora para pulverizarla (opcional).",
          "Añade la leche, la proteína whey y la miel.",
          "Bate a máxima potencia durante 45 segundos."
        ]
      },
      {
        title: "Sartén de Carne Picada, Patata y Huevos (Cena)",
        target: "Cena (21:00)",
        ingredients: ["Carne picada 5%", "Huevos L", "Patata", "Pan integral", "AOVE", "Verdura"],
        steps: [
          "Cuece o haz al microondas la patata troceada.",
          "Marca la carne picada en la sartén con aceite y la verdura.",
          "Añade los huevos y revuelve junto con la patata."
        ]
      }
    ];

    /* ==========================================
       CAPA 2: SERVICIOS EXTERNOS (GOOGLE DRIVE)
       ========================================== */
    const DriveService = {
      initAuth(onSuccess) {
        try {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: '743772639737-jrf3qhna3putebqeve97i7p1krftd6j3.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                localStorage.setItem("google_access_token", response.access_token);
                onSuccess(response.access_token);
              }
            },
          });
          client.requestAccessToken();
        } catch (err) {
          console.error("Error OAuth:", err);
        }
      },
      async saveProfileData(profileId, payload) {
        const token = localStorage.getItem("google_access_token");
        if (!token) return false;
        console.log(`[DriveSync] Sincronizado perfil ${profileId} en Google Drive`, payload);
        return true;
      }
    };

    /* ==========================================
       CAPA 3 & 4: COMPONENTES VISUALES Y NÚCLEO
       ========================================== */
    function App() {
      const [openMeal, setOpenMeal] = React.useState("desayuno");
      const [activeTab, setActiveTab] = React.useState("dieta");
      const [openRecipe, setOpenRecipe] = React.useState(null);

      // Estado Multi-Perfil y Escalador de Calorías
      const [profiles, setProfiles] = React.useState(() => {
        try {
          const saved = localStorage.getItem("dieta_profiles_v53");
          return saved ? JSON.parse(saved) : [DEFAULT_PROFILE];
        } catch {
          return [DEFAULT_PROFILE];
        }
      });
      const [activeProfileId, setActiveProfileId] = React.useState("principal");
      const [newProfileName, setNewProfileName] = React.useState("");

      const currentProfile = profiles.find(p => p.id === activeProfileId) || DEFAULT_PROFILE;
      const targetKcal = currentProfile.baseKcal || 3000;
      const scaleFactor = targetKcal / 3000; // Factor multiplicador basado en 3000kcal base

      const [shoppingList, setShoppingList] = React.useState(() => {
        try {
          const saved = localStorage.getItem(`dieta_shopping_${activeProfileId}`);
          return saved ? JSON.parse(saved) : INITIAL_SHOPPING_LIST;
        } catch {
          return INITIAL_SHOPPING_LIST;
        }
      });

      const [weightLogs, setWeightLogs] = React.useState(() => {
        try {
          const saved = localStorage.getItem(`dieta_weights_${activeProfileId}`);
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [currentWeightInput, setCurrentWeightInput] = React.useState("");
      const [weightNote, setWeightNote] = React.useState("");
      const [syncStatus, setSyncStatus] = React.useState(null);

      React.useEffect(() => {
        try {
          localStorage.setItem("dieta_profiles_v53", JSON.stringify(profiles));
        } catch {}
      }, [profiles]);

      React.useEffect(() => {
        try {
          localStorage.setItem(`dieta_shopping_${activeProfileId}`, JSON.stringify(shoppingList));
        } catch {}
      }, [shoppingList, activeProfileId]);

      React.useEffect(() => {
        try {
          localStorage.setItem(`dieta_weights_${activeProfileId}`, JSON.stringify(weightLogs));
        } catch {}
      }, [weightLogs, activeProfileId]);

      const toggleCheck = (category, id) => {
        setShoppingList(prev => ({
          ...prev,
          [category]: prev[category].map(item => 
            item.id === id ? { ...item, checked: !item.checked } : item
          )
        }));
      };

      const resetShoppingList = () => {
        setShoppingList(INITIAL_SHOPPING_LIST);
      };

      const handleAddProfile = (e) => {
        e.preventDefault();
        if (!newProfileName.trim()) return;
        const newProf = {
          id: `profile_${Date.now()}`,
          name: newProfileName.trim(),
          baseKcal: 3000
        };
        const updated = [...profiles, newProf];
        setProfiles(updated);
        setActiveProfileId(newProf.id);
        setNewProfileName("");
      };

      const updateKcal = (delta) => {
        const updated = profiles.map(p => {
          if (p.id === activeProfileId) {
            const nextKcal = Math.max(2000, Math.min(5000, (p.baseKcal || 3000) + delta));
            return { ...p, baseKcal: nextKcal };
          }
          return p;
        });
        setProfiles(updated);
      };

      const handleAddWeight = (e) => {
        e.preventDefault();
        if (!currentWeightInput) return;
        const newLog = {
          id: Date.now(),
          date: new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "short", year: "numeric" }),
          weight: parseFloat(currentWeightInput),
          note: weightNote || "Peso en ayunas"
        };
        const updated = [newLog, ...weightLogs];
        setWeightLogs(updated);
        setCurrentWeightInput("");
        setWeightNote("");
        
        DriveService.saveProfileData(activeProfileId, { profile: currentProfile, weights: updated, shopping: shoppingList });
        setSyncStatus("Sincronizado ✓");
      };

      const handleGoogleLogin = () => {
        DriveService.initAuth(() => {
          setSyncStatus("Conectado ✓");
          DriveService.saveProfileData(activeProfileId, { profile: currentProfile, weights: weightLogs, shopping: shoppingList });
        });
      };

      // Macros calculados dinámicamente
      const currentProtein = Math.round(198 * scaleFactor);
      const currentFats = Math.round(78 * scaleFactor);
      const currentCarbs = Math.round(360 * scaleFactor);

      return (
        <div className="min-h-screen bg-[#f8faf8] text-[#111c14] selection:bg-[#0f2a1d] selection:text-white">
          
          <header className="w-full bg-[#0f2a1d] text-white sticky top-0 z-20 shadow-md">
            <div className="max-w mx-auto px-4 py-3.5 flex items-center justify-between">
              <div>
                <div className="inline-flex items-center gap-1.5 text-[11px] font-bold tracking-wider uppercase text-[#a8e6a0]">
                  <span className="w-2 h-2 rounded-full bg-[#a8e6a0] animate-pulse"></span>
                  {currentProfile.name} ({APP_VERSION})
                </div>
                <h1 className="text-xl font-bold tracking-tight">Dieta Hipertrofia Dinámica</h1>
              </div>
              <div>
                <span className="text-xs font-semibold px-3 py-1 rounded-full bg-white/10 text-white/90">
                  {syncStatus || "Local"}
                </span>
              </div>
            </div>
          </header>

          <main className="max-w mx-auto px-4 pt-5 pb-16 fade-in">
            {activeTab === "dieta" && (
              <>
                {/* SELECTOR DE PERFILES */}
                <section className="mb-4">
                  <div className="flex items-center justify-between mb-2">
                    <h2 className="text-xs font-bold tracking-wider text-black/50 uppercase">Perfil Activo</h2>
                  </div>
                  <div className="flex items-center gap-2 overflow-x-auto pb-1">
                    {profiles.map(p => (
                      <button
                        key={p.id}
                        onClick={() => setActiveProfileId(p.id)}
                        className={`px-3.5 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${p.id === activeProfileId ? 'bg-[#0f2a1d] text-white shadow-sm' : 'bg-white border border-[#e2e6e0] text-black/70'}`}
                      >
                        {p.name}
                      </button>
                    ))}
                  </div>
                </section>

                <section className="mb-5">
                  <div className="flex items-center justify-between mb-2.5">
                    <h2 className="text-xs font-bold tracking-wider text-black/50 uppercase">1. Escalador Calórico Diario</h2>
                    <div className="flex items-center gap-1.5">
                      <button onClick={() => updateKcal(-50)} className="w-7 h-7 rounded-lg bg-[#eef2ec] font-bold text-xs text-[#0f2a1d] flex items-center justify-center active:scale-95">-50</button>
                      <button onClick={() => updateKcal(50)} className="w-7 h-7 rounded-lg bg-[#eef2ec] font-bold text-xs text-[#0f2a1d] flex items-center justify-center active:scale-95">+50</button>
                    </div>
                  </div>

                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-sm space-y-3">
                    <div className="rounded-xl bg-[#0f2a1d] text-white p-4 flex items-center justify-between">
                      <div>
                        <span className="text-xs font-medium text-white/70">Aporte Calórico Objetivo</span>
                        <div className="text-2xl font-bold">{targetKcal} <span className="text-sm font-normal text-white/80">kcal / día</span></div>
                      </div>
                      <div className="text-2xl">⚡</div>
                    </div>

                    <div className="grid grid-cols-3 gap-2.5">
                      <div className="rounded-xl bg-[#f4f7f3] p-3 text-center border border-[#e2e6e0]">
                        <span className="block text-[11px] font-semibold text-black/50">Proteína</span>
                        <span className="text-base font-bold text-[#0f2a1d]">{currentProtein}g</span>
                      </div>
                      <div className="rounded-xl bg-[#f4f7f3] p-3 text-center border border-[#e2e6e0]">
                        <span className="block text-[11px] font-semibold text-black/50">Grasas</span>
                        <span className="text-base font-bold text-[#0f2a1d]">{currentFats}g</span>
                      </div>
                      <div className="rounded-xl bg-[#f4f7f3] p-3 text-center border border-[#e2e6e0]">
                        <span className="block text-[11px] font-semibold text-black/50">Carbos</span>
                        <span className="text-base font-bold text-[#0f2a1d]">{currentCarbs}g</span>
                      </div>
                    </div>
                  </div>
                </section>

                <section className="mb-5">
                  <div className="flex items-center justify-between mb-2.5">
                    <h2 className="text-xs font-bold tracking-wider text-black/50 uppercase">2. Menú Diario (Recalculado)</h2>
                    <span className="text-xs text-black/50">Toca para desplegar</span>
                  </div>

                  <div className="flex flex-col gap-3">
                    {BASE_MEALS_DATA.map((meal) => {
                      const isOpen = openMeal === meal.id;
                      const mealKcal = Math.round(meal.baseKcal * scaleFactor);
                      const mealProt = Math.round(meal.baseProtein * scaleFactor);

                      return (
                        <div key={meal.id} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isOpen ? 'border-[#0f2a1d] shadow-sm ring-1 ring-[#0f2a1d]/15' : 'border-[#e2e6e0]'}`}>
                          <button 
                            onClick={() => setOpenMeal(isOpen ? null : meal.id)}
                            className="w-full flex items-center justify-between px-4 py-4 text-left active:bg-black/5 transition"
                          >
                            <div className="flex items-center gap-3.5">
                              <div className={`w-11 h-11 rounded-xl flex items-center justify-center text-sm font-bold font-mono transition ${isOpen ? 'bg-[#0f2a1d] text-white' : 'bg-[#eef2ec] text-[#0f2a1d]'}`}>
                                {meal.time}
                              </div>
                              <div>
                                <div className="text-base font-bold leading-tight">{meal.label}</div>
                                <div className="text-xs text-black/60 mt-0.5">{meal.baseFoods.length} ingredientes</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3">
                              <div className="text-right">
                                <div className="text-sm font-bold text-[#0f2a1d]">{mealProt}g P</div>
                                <div className="text-xs font-medium text-black/60">{mealKcal} kcal</div>
                              </div>
                              <span className={`text-xs text-black/40 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                            </div>
                          </button>

                          {isOpen && (
                            <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9] fade-in">
                              <div className="space-y-3 text-sm">
                                {meal.baseFoods.map((food, idx) => {
                                  const scaledAmount = food.unit === 'uds' 
                                    ? Math.round(food.baseAmount * scaleFactor) 
                                    : Math.round(food.baseAmount * scaleFactor);
                                  return (
                                    <div key={idx} className="flex items-center justify-between py-1.5 border-b border-[#f0f3ef] last:border-0">
                                      <span className="text-[#1a2b1f] font-semibold text-sm">{food.name}</span>
                                      <span className="font-mono text-sm font-bold bg-white px-2.5 py-1 rounded-md border border-[#e2e6e0] text-black/90">
                                        {scaledAmount}{food.unit}
                                      </span>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </section>
              </>
            )}

            {activeTab === "alternativas" && (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Alternativas Rápidas (Plan B)</h2>
                  <p className="text-sm text-black/70">Estrategias exprés para días con prisa o sin táperes listos.</p>
                </div>
                {ALTERNATIVES_DATA.map((alt, idx) => (
                  <div key={idx} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs space-y-3">
                    <h3 className="text-base font-bold text-[#0f2a1d]">{alt.title}</h3>
                    <p className="text-sm text-black/70 leading-relaxed">{alt.desc}</p>
                    <div className="space-y-2.5 border-t border-[#f0f3ef] pt-3 mt-2">
                      {alt.items.map((item, i) => (
                        <div key={i} className="text-sm leading-relaxed">
                          <span className="font-bold text-[#1a2b1f]">• {item.name}: </span>
                          <span className="text-black/85">{item.detail}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </section>
            )}

            {activeTab === "compra" && (
              <section className="space-y-4 fade-in">
                <div className="flex items-center justify-between mb-1">
                  <div>
                    <h2 className="text-xl font-bold text-[#0f2a1d]">Lista de Compra Semanal</h2>
                    <p className="text-sm text-black/70">Toca un elemento para marcarlo en el súper.</p>
                  </div>
                  <button onClick={resetShoppingList} className="text-xs font-semibold text-[#0f2a1d] underline bg-[#eef2ec] px-3.5 py-2 rounded-xl">
                    Desmarcar todo
                  </button>
                </div>

                <div className="space-y-4">
                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#e8f5e6] flex items-center justify-center text-xs font-bold text-[#0f2a1d]">M</div>
                      <h3 className="text-base font-bold">Mercadona (Frescos)</h3>
                    </div>
                    <div className="space-y-2">
                      {shoppingList.mercadona.map((item) => (
                        <button
                          key={item.id}
                          onClick={() => toggleCheck('mercadona', item.id)}
                          className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${item.checked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                        >
                          <div className="flex items-center gap-3">
                            <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${item.checked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>
                              {item.checked ? '✓' : ''}
                            </span>
                            <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                          </div>
                          <span className="font-mono text-xs font-bold text-black/90">{item.qty}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                    <div className="flex items-center gap-2.5 mb-3.5 pb-2 border-b border-[#f0f3ef]">
                      <div className="w-8 h-8 rounded-xl bg-[#fff4d6] flex items-center justify-center text-xs font-bold text-[#5a4100]">L</div>
                      <h3 className="text-base font-bold">Lidl / Hiperdino (Despensa)</h3>
                    </div>
                    <div className="space-y-2">
                      {shoppingList.despensa.map((item) => (
                        <button
                          key={item.id}
                          onClick={() => toggleCheck('despensa', item.id)}
                          className={`w-full flex items-center justify-between p-3 rounded-xl transition text-left ${item.checked ? 'bg-[#f4f4f0] opacity-50 line-through' : 'bg-[#fafcf9] hover:bg-[#f0f3ef]'}`}
                        >
                          <div className="flex items-center gap-3">
                            <span className={`w-5.5 h-5.5 rounded-md border flex items-center justify-center text-xs font-bold ${item.checked ? 'bg-[#0f2a1d] border-[#0f2a1d] text-white' : 'border-black/30 bg-white'}`}>
                              {item.checked ? '✓' : ''}
                            </span>
                            <span className="text-sm font-semibold text-[#1a2b1f]">{item.name}</span>
                          </div>
                          <span className="font-mono text-xs font-bold text-black/90">{item.qty}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </section>
            )}

            {activeTab === "logistica" && (
              <section className="space-y-5 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Centro de Cocina & Recetario</h2>
                  <p className="text-sm text-black/70">Batch cooking y recetas exactas basadas en tus tomas en crudo.</p>
                </div>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-5 space-y-4 text-sm leading-relaxed shadow-2xs">
                  <h3 className="text-base font-bold text-[#0f2a1d] pb-2 border-b border-[#f0f3ef]">Estrategia General (Batch Cooking)</h3>
                  <div>
                    <h4 className="font-bold text-[#1a2b1f] text-sm mb-1">1. Cocción de Carbohidratos Base</h4>
                    <p className="text-black/80 text-sm">Cocina el arroz en crudo cada 3-4 días según tu escala calórica. Déjalo enfriar por completo y guárdalo en táperes herméticos.</p>
                  </div>
                  <div className="border-t border-[#f0f3ef] pt-3">
                    <h4 className="font-bold text-[#1a2b1f] text-sm mb-1">2. Preparación de Proteínas</h4>
                    <p className="text-black/80 text-sm">Prepara la pechuga de pollo a la plancha para 2 días consecutivos. La carne picada conviene marcarla en la sartén justo antes del consumo.</p>
                  </div>
                </div>

                <div className="space-y-3">
                  <h3 className="text-base font-bold text-[#0f2a1d] pt-2">Recetario Dinámico de las Tomas</h3>
                  {RECIPES_DATA.map((recipe, idx) => {
                    const isRecipeOpen = openRecipe === idx;
                    return (
                      <div key={idx} className={`rounded-2xl border transition-all bg-white overflow-hidden ${isRecipeOpen ? 'border-[#0f2a1d] shadow-sm ring-1 ring-[#0f2a1d]/15' : 'border-[#e2e6e0]'}`}>
                        <button
                          onClick={() => setOpenRecipe(isRecipeOpen ? null : idx)}
                          className="w-full flex items-center justify-between p-4 text-left active:bg-black/5 transition"
                        >
                          <div>
                            <span className="text-[11px] font-bold text-[#0f2a1d] uppercase tracking-wider bg-[#eef2ec] px-2.5 py-1 rounded-md">{recipe.target}</span>
                            <h4 className="text-base font-bold text-[#1a2b1f] mt-1.5">{recipe.title}</h4>
                          </div>
                          <span className={`text-xs text-black/40 transition-transform duration-200 ${isRecipeOpen ? 'rotate-180' : ''}`}>▼</span>
                        </button>

                        {isRecipeOpen && (
                          <div className="px-4 pb-4 pt-2 border-t border-[#f0f3ef] bg-[#fafcf9] space-y-3 fade-in">
                            <div>
                              <h5 className="text-xs font-bold text-black/50 uppercase tracking-wider mb-1.5">Ingredientes base:</h5>
                              <div className="flex flex-wrap gap-1.5">
                                {recipe.ingredients.map((ing, i) => (
                                  <span key={i} className="bg-white border border-[#e2e6e0] text-xs font-semibold text-[#1a2b1f] px-2.5 py-1 rounded-lg">
                                    {ing}
                                  </span>
                                ))}
                              </div>
                            </div>
                            <div className="border-t border-[#f0f3ef] pt-2.5">
                              <h5 className="text-xs font-bold text-black/50 uppercase tracking-wider mb-1.5">Preparación paso a paso:</h5>
                              <ol className="space-y-2 text-sm text-black/85 pl-4 list-decimal">
                                {recipe.steps.map((step, sIdx) => (
                                  <li key={sIdx} className="leading-relaxed">{step}</li>
                                ))}
                              </ol>
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>
            )}

            {activeTab === "peso" && (
              <section className="space-y-4 fade-in">
                <div className="mb-2">
                  <h2 className="text-xl font-bold text-[#0f2a1d]">Control de Peso & Perfiles en Drive</h2>
                  <p className="text-sm text-black/70">Gestiona múltiples perfiles y sincronízalos con la nube.</p>
                </div>

                {/* CREAR PERFIL */}
                <form onSubmit={handleAddProfile} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3 shadow-2xs">
                  <h3 className="text-sm font-bold">Añadir Nuevo Perfil / Usuario</h3>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Nombre del usuario..."
                      value={newProfileName}
                      onChange={(e) => setNewProfileName(e.target.value)}
                      className="flex-1 rounded-xl border border-[#e2e6e0] px-3.5 py-2.5 text-sm focus:outline-none focus:border-[#0f2a1d]"
                      required
                    />
                    <button type="submit" className="px-4 py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition">
                      Crear
                    </button>
                  </div>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 flex items-center justify-between gap-3 shadow-2xs">
                  <div>
                    <h3 className="text-sm font-bold text-[#0f2a1d]">Sincronización Drive</h3>
                    <p className="text-xs text-black/60">{syncStatus || "Conecta tu cuenta para sincronizar"}</p>
                  </div>
                  <button onClick={handleGoogleLogin} className="px-4 py-2.5 rounded-xl bg-[#0f2a1d] text-white text-xs font-semibold hover:bg-black transition">
                    Conectar Drive
                  </button>
                </div>

                <form onSubmit={handleAddWeight} className="rounded-2xl border border-[#e2e6e0] bg-white p-4 space-y-3 shadow-2xs">
                  <h3 className="text-sm font-bold">Nuevo Registro para {currentProfile.name}</h3>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-black/70 uppercase mb-1">Peso (kg)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        placeholder="74.5"
                        value={currentWeightInput}
                        onChange={(e) => setCurrentWeightInput(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3.5 py-3 text-sm font-mono focus:outline-none focus:border-[#0f2a1d]"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-black/70 uppercase mb-1">Notas</label>
                      <input 
                        type="text" 
                        placeholder="Sensaciones..."
                        value={weightNote}
                        onChange={(e) => setWeightNote(e.target.value)}
                        className="w-full rounded-xl border border-[#e2e6e0] px-3.5 py-3 text-sm focus:outline-none focus:border-[#0f2a1d]"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3.5 rounded-xl bg-[#0f2a1d] text-white text-sm font-semibold hover:bg-black transition">
                    Guardar y Sincronizar
                  </button>
                </form>

                <div className="rounded-2xl border border-[#e2e6e0] bg-white p-4 shadow-2xs">
                  <h3 className="text-sm font-bold mb-3">Historial de {currentProfile.name}</h3>
                  {weightLogs.length === 0 ? (
                    <p className="text-sm text-black/50 text-center py-4">Sin registros todavía en este perfil.</p>
                  ) : (
                    <div className="space-y-2.5">
                      {weightLogs.map((log) => (
                        <div key={log.id} className="flex items-center justify-between p-3 rounded-xl bg-[#f8faf8] border border-[#f0f3ef] text-sm">
                          <div>
                            <span className="font-semibold">{log.date}</span>
                            <p className="text-black/60 text-xs mt-0.5">{log.note}</p>
                          </div>
                          <span className="font-mono font-bold text-sm text-[#0f2a1d]">{log.weight} kg</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#e2e6e0] z-30">
            <div className="max-w mx-auto px-1 py-2 flex items-center justify-around">
              <button 
                onClick={() => setActiveTab("dieta")}
                className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "dieta" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}
              >
                <span className="text-lg">🍱</span>
                <span>Menú</span>
              </button>
              <button 
                onClick={() => setActiveTab("alternativas")}
                className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "alternativas" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}
              >
                <span className="text-lg">⚡</span>
                <span>Plan B</span>
              </button>
              <button 
                onClick={() => setActiveTab("compra")}
                className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "compra" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}
              >
                <span className="text-lg">🛒</span>
                <span>Compra</span>
              </button>
              <button 
                onClick={() => setActiveTab("logistica")}
                className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "logistica" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}
              >
                <span className="text-lg">🍳</span>
                <span>Cocina</span>
              </button>
              <button 
                onClick={() => setActiveTab("peso")}
                className={`flex flex-col items-center gap-1 text-xs font-semibold transition py-1 px-3 rounded-xl ${activeTab === "peso" ? 'text-[#0f2a1d] bg-[#f0f3ef]' : 'text-black/50'}`}
              >
                <span className="text-lg">📈</span>
                <span>Drive</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
